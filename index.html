, Student Council, school administration and the Head of Volunteers.</p>\n    <h2 class="priv-h">Privacy policy</h2>\n    ${e("1. Who runs this app",["This app is a student-run tool of Primum Auxilium, the volunteering team of Middle East International School - Al Wurud, Riyadh. It is run by the Head of Volunteers, who decides what is kept and why.","It is a school activity tool. It is not a government service, and it is not run by the Ministry of Education, Ataa Educational or the school's owners."])}\n    ${e("2. What is kept",["Your name in English and Arabic, your grade and class, your rank and status. If you change your name, your previous name is kept on your record.","Your volunteer hours, the events you signed up for, were picked for or attended, and your certificates.","<b>A photo of your Saudi Iqama, and a personal photo of you that the school administration or the Head adds to your profile.</b> The school administration requires these before the app can be used, to confirm who each volunteer is.","Whether you have an Absher account and an activated Nafath, as <b>yes or no only</b>. It is used for one thing: deciding whether you can be picked for events. It is not used for anything else, and nobody is judged for it.","What you write in the app: questions, complaints, appeals and chat messages. Complaints carry the sender's name; they are shown to the Head and Student Council only.","Photos that are uploaded for an event or a certificate, and a change history of who edited what and when.","Technical items needed to run the app: a sign-in session, a random device key, and, only if you switch notifications on, your browser's notification address.","<b>Visit counts:</b> which page was opened and when, and the country, device type and browser it was opened from. They are anonymous. They carry no name, no account and nothing you enter in the app, so they cannot be tied to a person.","<b>Not kept:</b> Iqama or ID numbers typed in, Absher or Nafath passwords or codes, phone numbers, home addresses, your exact location, or anything from your device's camera, contacts or files."])}\n    ${e("3. Why it is kept",["To run the team: record hours, pick volunteers fairly, issue certificates, handle appeals and questions, confirm who each volunteer is, and keep an audit trail.","It is <b>not</b> sold, rented, used for advertising, used for marketing or profiling, or used to train any system.","Visit counts are used only to see how often the app is opened."])}\n    ${e("4. Who can see it",["<b>You</b> see your own record, hours, certificates and messages.","<b>Other volunteers</b> see only your name, class and rank, for event lists. Volunteers at the same event can open each other's certificate for that event.","<b>Shift leads</b> see attendance notes for the events they lead. <b>Club teachers and proctors</b> see only their own club.","<b>The Student Council</b> sees names and classes (and previous names), questions and complaints sent to it, appeals, status requests and the change history. It never sees the Head's private notes.","<b>School administration</b> sees the roster, hours, events, certificates, appeals, status requests and the change history, and can export this information.","<b>The Head of Volunteers</b> sees everything, to run the team. Visit counts are shown to the Head of Volunteers only.","<b>Your Iqama photo and personal photo can be opened, downloaded and replaced only by the school administration and the Head of Volunteers.</b> The Student Council and other volunteers cannot see them, and you cannot open them again after sending them.","Everyone with access is a member of the school community and is expected to keep what they see to themselves."])}\n    ${e("5. Other companies that handle it",["<b>Supabase</b> stores the database. <b>GitHub Pages</b> and <b>Vercel</b> serve the app's files. Vercel also counts visits with Vercel Web Analytics, which uses no cookies and does not follow anyone across other sites. Their servers may be outside Saudi Arabia.","<b>Browser notification services</b> (run by your browser or phone maker, such as Google, Apple, Microsoft or Mozilla) deliver notifications if you turn them on. You can turn them off at any time in the app or in your phone settings.","Nothing is shared with any other person or organisation unless the law requires it, or the Head or school administration must pass it to the school for a safeguarding, discipline or legal reason. Hours or certificates are shared outside the school only if you ask for that."])}\n    ${e("6. Protection",["Data is reachable only through this app, and only after signing in. Passwords are stored scrambled. Repeated wrong passwords lock the name for a while. Signing out clears the copy kept on your phone.","No online system is perfectly safe. The team uses reasonable care but cannot promise that nothing will ever go wrong. Never share your password."])}\n    ${e("7. How long, and your choices",["Records are kept while you are on the team and for the following school year, for audits and certificates. After that the Head deletes or anonymises them, and identity photos are deleted.","You can ask the Head of Volunteers, in person or through the app, to show you what is kept about you, correct it, or delete it. Some records (such as hours already certified, identity photos the school requires, and the change history) may need to stay for audit or safeguarding, and will be limited to what is necessary.","You can stop volunteering at any time. You can switch notifications off at any time."])}\n    ${e("8. Under-18s",["Many volunteers are under 18. If you are under 18, you may use this app only with the knowledge and agreement of your parent or guardian, who may contact the Head or the school at any time to ask for access, correction or deletion.","Accepting these terms in the app confirms that this agreement exists."])}\n    ${e("9. Changes",["This policy may change. When it does, the version number changes and you will be asked to confirm it again before you continue. Older versions and who accepted them are kept as a record."])}\n    <h2 class="priv-h">Terms of use</h2>\n    ${e("10. Volunteering is voluntary",["Volunteering with Primum Auxilium is a voluntary school activity. It is unpaid. No job, payment, grade, privilege or guarantee comes with it.","Being signed up does not guarantee being picked. Being picked does not guarantee a place or a certificate.","Taking part is at your own choice, and, for under-18s, with the agreement of your parent or guardian. Volunteers follow school rules, the instructions of the supervising teachers and the team's code of conduct at all times, on and off school grounds during events."])}\n    ${e("11. Hours, ranks and certificates",["The Head of Volunteers, the Student Council and school administration decide what counts as volunteering, how many hours count, who is picked and which rank or status a volunteer has. <b>Their decisions are final</b>, subject to the appeal process in the app.","Hours are recorded by the team and signed off by the Head of Volunteers or the school administration. Supervisors only confirm who was there. Hours may be corrected or removed if they are wrong or if a rule was broken. A limit applies to the hours counted for each event.","Certificates are issued by the team. <b>Primum Auxilium does not promise that any university, scholarship, employer, government body or the National Volunteer Platform will accept, recognise or count these hours or certificates.</b>","Some events need an active Absher account and activated Nafath. A volunteer without both cannot be picked for events until they are confirmed.","Grade 11 can take part only while the school administration has switched it on."])}\n    ${e("12. Using the app properly",["Be truthful. Do not enter false hours, share your sign-in, use someone else's, try to read others' data, or break or overload the app. Be respectful in messages and complaints.","Send real photos of your own Iqama and of yourself. A false, edited or someone else's document is a serious breach.","A student can change their displayed name once. The previous name stays on the record.","Content that is abusive, false or harmful can be removed, and access can be limited or ended. Misuse can also be handled under school discipline."])}\n    ${e("13. Complaints",["Complaints carry the sender's name, because the team has to be able to follow them up. They are seen by the Head and the Student Council only. A person who raises a complaint in good faith will not be treated worse for doing so. Complaints made in bad faith may be dealt with under school rules."])}\n    ${e("14. Limits",["The app is provided as it is, free of charge, and may be slow, wrong, offline or changed at any time. Information shown in it can contain mistakes.","To the fullest extent the law allows, the Head of Volunteers, the Student Council, the team's members and its volunteer staff are not responsible for losses that come from using, or not being able to use, the app, from mistakes in the information in it, or from decisions made on the basis of it. Nothing here removes any right you have under the law that cannot be removed, or limits responsibility that the law does not let anyone limit.","Responsibility for the school, its activities and its students stays with the school as set out in its own policies. These terms do not replace them."])}\n    ${e("15. Suspension and other measures",["For any reason, at any time, and without warning, the Head of Volunteers, the Student Council or the school administration may suspend a person from volunteering, hold back or invalidate hours or certificates, limit or end access to the app, or place a person on the blacklist.","A blacklist, and any other measure taken together with it, can be passed to the school and may lead to further consequences under the school's own rules, including consequences that affect a student's standing at school, academic standing included.","A person who is blacklisted can send one appeal at a time through the app. Decisions on appeals are final."])}\n    ${e("16. Law and questions",["These terms and this policy are read under the laws of the Kingdom of Saudi Arabia, including the Personal Data Protection Law. If any part is not valid, the rest still applies.","To ask a question, make a request about your data or report a privacy problem, speak to the Head of Volunteers or use the Questions tab in the app."])}\n    <p class="muted" style="font-size:13px">Primum Auxilium, sponsored by Middle East International School - Al Wurud.</p></div>`}const Ut=()=>"pa-consent-"+(et&&et.id),Gt=()=>{if(!et)return!1;try{const e=localStorage.getItem(Ut());return u.cnsPrev=e&&e!==Vt?e:null,e!==Vt}catch{return!1}};function Yt(){document.body.classList.add("gated"),document.body.classList.remove("ro"),p("#overlayHost").innerHTML="",u.drawer=null,u.modal=null;const e=p("#view");e.innerHTML=function(){const e=kt(),t=H(),a=(e,t,a)=>`<div class="gate"><div class="gate-card panel"><img class="gate-crest" src="${Ht()}" alt=""><div class="motto">${m(s.settings.teamName||"Primum Auxilium")}</div><h2>${e}</h2>${t?`<p class="muted gate-sub">${t}</p>`:""}${a}<div class="gate-partners"><img src="${p("#meisLogo").src}" alt="Middle East International School - Al Wurud"><img class="side" src="${p("#ataaLogo").src}" alt="Ataa Educational"><img class="moe side" src="${p("#moeLogo").src}" alt="Ministry of Education"></div></div></div>`;return"key"===u.gate?a("Recovery key","Resets the Head password if it is lost. Shown once.",`<div class="keybox num" id="keyText">${m(u.newKey)}</div>\n    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="key-copy">Copy</button>${l?'<button class="btn" data-act="key-save">Download</button>':""}</div>\n    <label class="checkrow" style="margin-top:6px"><input type="checkbox" id="keyOk"><span><b>Key stored safely</b></span>< omotions</h3><p>Judge Probationary volunteers on <b>punctuality, composure, initiative and following the rules</b>. Send your recommendation to the Head by DM with a one-line reason. The Head reviews weekly.</p></li>\n<li><h3>Fairness</h3><ul><li>No favourites, no threats, no hazing.</li><li>Never penalize anyone for feedback or a complaint.</li><li>Disrespectful feedback: archive it and tell the Head.</li><li>Breaking this means losing your rank and a referral to school administration.</li></ul></li>\n<li><h3>Conflicts in 3 steps</h3><div class="steps3"><div><b>1</b><span>Separate and calm. Talk to each person alone.</span></div><div><b>2</b><span>Fix simple mix-ups on the spot.</span></div><div><b>3</b><span>Serious (refusal, aggression, safety): end their shift, take vest and badge, report to the Head within 2 h.</span></div></div><p class="muted">Never argue on the event floor or in open channels.</p></li>\n<li><h3>Gear</h3><ul><li>Vests only after sign-out.</li><li>Damaged or dirty vests out of rotation, report it.</li><li>Nobody leaves until their gear is checked in.</li></ul></li>\n<li><h3>Your reviews</h3><p>The Head reviews you three times a term. Strong supervisors receive end-of-year leadership certificates.</p></li>\n</ol>\n<footer class="hb-foot">Leading in Primum Auxilium means following this handbook.<div class="hb-credit"><img src="MEISL" alt=""><span>Sponsored by Middle East International School - Al Wurud<br><small>School owned by Ataa Educational · Ministry of Education</small></span><img src="ATAAL" alt="" class="side"><img src="MOEL" alt="" class="moe side"></div></footer>':'<header class="hb-head"><img src="CREST" alt=""><div><div class="eyebrow">Primum Auxilium · MEIS</div><h2>Volunteer Handbook</h2><div class="muted">For every volunteer · 3-minute read</div></div></header>\n<ol class="hb">\n<li><h3>What we do</h3><p>We help run school and community events so they go smoothly and safely.</p></li>\n<li><h3>Your goal</h3><ul><li><b>40 hours</b> every school year.</li><li>Grade 12 gets spots first.</li><li>Grade 11 starts in semester 2 (January).</li></ul></li>\n<li><h3>Who to ask</h3><div class="chain"><span>Probationary</span><i>›</i><span>Elected</span><i>›</i><span>Supervisory</span><i>›</i><span>Head of Volunteers</span></div><p>New members start as Probationary with a mentor. Questions go to the person one step above you.</p></li>\n<li><h3>At every event</h3><div class="hb3"><div><b>Before</b><ul><li>Confirm you\'re coming.</li><li>Arrive on time.</li><li>School uniform + PA vest.</li></ul></div><div><b>During</b><ul><li>Stay at your post and stay active.</li><li>Be polite and helpful.</li><li>Take your break when told.</li></ul></div><div><b>After</b><ul><li>Put everything back.</li><li>Return your vest and badge.</li><li>Hours are signed off within 12 hours.</li></ul></div></div></li>\n<li><h3>Outside school</h3><ul><li>Only with approval from the school and the Head.</li><li>Formal dress and your ID.</li><li>Be at the meeting point on time.</li><li>Respect local customs. You represent MEIS.</li><li>The organizer gives your certificate.</li></ul></li>\n<li><h3>If something goes wrong</h3><ul><li>Stay calm. Never argue in public.</li><li>Tell your supervisor.</li><li>Safety problem: tell the Head straight away.</li></ul></li>\n<li><h3>Getting promoted</h3><div class="pills4"><span>On time</span><span>Calm</span><span>Takes initiative</span><span>Follows the rules</span></div></li>\n<li><h3>Speak up</h3><p>Use <b>Questions & complaints</b> in this app any time. The Head of Volunteers and the Student Council read them. Your name goes with it, and a complaint is never held against you unless it is an outright personal attack.</p></li>\n</ol>\n<footer class="hb-foot">Volunteering with Primum Auxilium means following this handbook.<div class="hb-credit"><img src="MEISL" alt=""><span>Sponsored by Middle East International School - Al Wurud<br><small>School owned by Ataa Educational · Ministry of Education<
