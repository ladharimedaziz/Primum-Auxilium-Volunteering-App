<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primum Auxilium</title>
<link rel="icon" href="crest.png">
<meta name="theme-color" content="#233253">
<style>
:root{--navy:#233253;--slate:#667589;--silver:#C9CED6;--bg:#EDF0F5;--ink:#131B2D;--muted:#566279}
@media (prefers-color-scheme:dark){:root{--bg:#0C111D;--ink:#E5E9F1;--muted:#94A0B6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 80% -10%,rgba(102,117,137,.25),transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{text-align:center;max-width:420px}
img{height:150px;width:auto;filter:drop-shadow(0 10px 22px rgba(20,30,60,.35));animation:in 1s cubic-bezier(.2,1.3,.4,1) both}
.m{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-top:18px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:6px 0 10px;letter-spacing:.03em}
p{color:var(--muted);margin:0}
.bar{height:6px;width:160px;margin:22px auto 0;border-radius:6px;background:linear-gradient(var(--silver) 0 40%,var(--slate) 40%)}
.cr{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 28px;margin-top:34px;padding-top:20px;border-top:1px solid rgba(102,117,137,.3)}
.cr div{display:flex;align-items:center;gap:10px;text-align:left}
.cr img{height:46px;filter:none;animation:none}
.cr small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);font-weight:700}
.cr b{font-size:14px}
@keyframes in{from{opacity:0;transform:translateY(-12px) scale(.9)}}

/* motion */
body::before,body::after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(80px);opacity:.35;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body::before{background:var(--navy);top:-160px;left:-140px}
body::after{background:var(--slate);bottom:-200px;right:-160px;animation-delay:-9s}
@keyframes drift{to{transform:translate(120px,80px) scale(1.15)}}
main>img{animation:in 1s cubic-bezier(.2,1.3,.4,1) both,float 6s 1.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.m,h1,main>p,.bar,.cr>div{animation:rise .8s cubic-bezier(.2,.9,.2,1) both}
.m{animation-delay:.25s}h1{animation-delay:.38s}main>p{animation-delay:.5s}.bar{animation-delay:.62s}.cr>div:first-child{animation-delay:.8s}.cr>div:last-child{animation-delay:.92s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
h1{background:linear-gradient(100deg,var(--ink) 40%,var(--silver) 50%,var(--ink) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s .38s cubic-bezier(.2,.9,.2,1) both,shine 5s 1.5s ease-in-out infinite}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
.bar{position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:sweep 2.6s 1.4s ease-in-out infinite}
@keyframes sweep{70%,100%{transform:translateX(100%)}}
.cr>div{transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.cr>div:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}h1{color:var(--ink)}}
</style>
</head>
<body>
<main>
<img src="crest.png" alt="Primum Auxilium crest">
<div class="m">Volunteering team</div>
<h1>Primum Auxilium</h1>
<p>The volunteer app opens here soon. Sign-in details come from the Head of Volunteers.</p>
<div class="bar"></div>
<div class="cr"><div><img src="meis.webp" alt="Middle East International School"><span><small>Sponsored by</small><b>Middle East International School</b></span></div><div><img src="moe.webp" alt="Ministry of Education"><span><small>Under the supervision of</small><b>Ministry of Education</b></span></div></div>
</main>
</body>
</html>
