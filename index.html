/* ---------- motion: ripple, tilt, reveal, parallax ---------- */
(() => {
  if (reduced()) return;
  // Ink ripple from the press point on buttons and tappable cards.
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest("button,.btn,label.btn,.tab,.qa,.vrow,.post,.bcard,.rs-head,.chip.out,.attrow,.srow,.mev");
    if (!el || el.disabled) return;
    const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, ink = document.createElement("span");
    ink.className = "ripple"; ink.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    if (getComputedStyle(el).position === "static") el.style.position = "relative";
    el.classList.add("has-ripple"); el.appendChild(ink); setTimeout(() => ink.remove(), 650);
  }, { passive: true });
  // Gentle 3D tilt that follows the pointer on headline cards.
  const TILT = ".kpi,.post,.ccard,.vcert,.gate-card,.qa";
  let tilted = null;
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const el = e.target.closest(TILT);
    if (tilted && tilted !== el) { tilted.style.transform = ""; tilted = null; }
    if (!el) return;
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    el.style.transform = `perspective(900px) rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg) translateY(-2px)`;
    el.style.setProperty("--mx", `${(x + .5) * 100}%`); el.style.setProperty("--my", `${(y + .5) * 100}%`);
    tilted = el;
  }, { passive: true });
  document.addEventListener("pointerleave", () => { if (tilted) { tilted.style.transform = ""; tilted = null; } });
  // Panels below the fold rise in as they scroll into view.
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { rootMargin: "0px 0px -40px 0px" });
  new MutationObserver(() => document.querySelectorAll("#view .panel:not(.rv),#view .rgrp:not(.rv),#view .post:not(.rv),#view .msg:not(.rv)").forEach(el => {
    el.classList.add("rv"); if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("below"); io.observe(el); }
  })).observe($("#view"), { childList: true, subtree: true });
  // Header crest drifts with scroll.
  const ghost = $(".band .ghost"), crest = $("#crestImg");
  addEventListener("scroll", () => { const y = Math.min(scrollY, 300); if (ghost) ghost.style.translate = `0 ${y * .25}px`; if (crest) crest.style.translate = `0 ${y * .08}px`; }, { passive: true });
})();


/* ---------- feedback on every action ---------- */
(() => {
  if (reduced()) return;
  const kick = (el, c) => { if (!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); setTimeout(() => el.classList.remove(c), 700); };
  // Saving any form pulses its main button.
  document.addEventListener("submit", e => kick(e.target.querySelector("button[type=submit]"), "pulse"), true);
  // A changed choice flashes so it's clear it registered.
  document.addEventListener("change", e => { const t = e.target; if (t.matches("select,input[type=date],input[type=time],input[type=number]")) kick(t, "flash"); if (t.matches("input[type=checkbox],input[type=radio]")) kick(t.closest("label,.attrow,.checkrow") || t, "tick"); }, true);

VIEWS.congress = () => {

};
after.congress = () => {
  const f = $("#cgFind"), pk = $("#cgPick");
  f?.addEventListener("input", () => { const q = f.value.trim().toLowerCase(); let first = null; [...pk.options].forEach(o => { const m = !q || o.textContent.toLowerCase().includes(q); o.hidden = !m; if (m && !first) first = o; }); if (first && pk.selectedOptions[0]?.hidden) pk.value = first.value; });
  $("#cgSeatForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const id = pk.value; if (!id || S.seats[id]) return;
    const num = Math.max(0, ...Object.values(S.seats).map(x => x.num || 0)) + 1;
    if (await put("seats", id, { vid: id, num, at: new Date().toISOString() }) === false) return;
    if (mode === "cloud") await cloudPull(false);
    ui.cgSel = id; ui.cgFresh = id; cgSeatFx(S.volunteers[id].name, S.seats[id]?.num || num); render(false); setTimeout(() => { ui.cgFresh = null; }, 2500);
  });
  const body = $("#cbBody"); if (body) body.dispatchEvent(new Event("input"));
  body?.addEventListener("input", () => { const n = body.value.split(/\n\s*\n/).filter(x => x.trim()).length; const c = $("#cbCount"); if (c) { c.textContent = `${n} of 5 paragraphs`; c.style.color = n > 5 ? "var(--danger)" : ""; } });
  $("#cgBillForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const mv = myVol(); if (!mv) return;
    const body2 = $("#cbBody").value.trim(), n = body2.split(/\n\s*\n/).filter(x => x.trim()).length, dr = [...new Set([mv.id, ...[...document.querySelectorAll('input[name=cbDr]:checked')].map(x => x.value)])];

    if (dr.length < 2) return toast("A bill needs at least 2 congressmen.");

    if (await put("bills", eid || uid(), { title: $("#cbTitle").value.trim(), legalName: $("#cbName").value.trim(), body: body2, drafters: dr, by: eb ? eb.by : mv.id, status: "voting", created: eb ? eb.created : new Date().toISOString(), ...(eb ? { editedAt: new Date().toISOString() } : {}) }) === false) return;
    if (eb && mode !== "cloud") for (const c of cgVotes(eid).filter(c => c.kind === "vote")) await del("cvotes", c.id);
    ui.cgDraft = false; if (mode === "cloud") await cloudPull(false); toast(eb ? "Bill updated, votes cleared" : "Bill sent to Congress"); render(false);
    if (eb) return;

function cgSeatFx(name, num) {
  document.querySelector(".cg-fx")?.remove();
  const d = document.createElement("div"); d.className = "cg-fx";
  d.innerHTML = `<div class="card"><div class="chair">${esc(initials(name))}</div>${GAVEL}<h3>${esc(name)}</h3><div class="muted">takes Seat ${num} in Congress</div></div>`;
  document.body.appendChild(d);

document.addEventListener("click", async e => {
  const a = e.target.closest("[data-cg]"); if (!a) return;
  const id = a.dataset.id, redraw = () => { if (view === "congress") { const el = $("#view"); el.innerHTML = VIEWS.congress(); after.congress(); } };
  switch (a.dataset.cg) {
    case "sel": ui.cgSel = ui.cgSel === id ? null : id; redraw(); break;
    case "open": ui.cgOpen = ui.cgOpen === id ? null : id; redraw(); break;
    case "draft": ui.cgDraft = true; redraw(); break;
    case "edit": ui.cgDraft = id; redraw(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "nodraft": ui.cgDraft = false; redraw(); break;
    case "ask-unseat": ui.cgConfirm = "seat:" + id; redraw(); break;
    case "ask-billdel": ui.cgConfirm = "bill:" + id; redraw(); break;
    case "noask": ui.cgConfirm = null; redraw(); break;
    case "reply": (ui.cgReply = ui.cgReply || {})[a.dataset.bill] = id; ui.cgOpen = a.dataset.bill; redraw(); setTimeout(() => document.querySelector(`form.cgQ[data-bill="${a.dataset.bill}"] textarea`)?.focus(), 30); break;
    case "noreply": if (ui.cgReply) delete ui.cgReply[id]; redraw(); break;
    case "unseat": if (await del("seats", id) !== false) { ui.cgConfirm = null; ui.cgSel = null; if (mode === "cloud") await cloudPull(false); toast("Seat removed"); redraw(); } break;
    case "billdel": { for (const c of cgVotes(id)) await del("cvotes", c.id); if (await del("bills", id) !== false) { ui.cgConfirm = null; if (mode === "cloud") await cloudPull(false); toast("Bill deleted"); redraw(); } break; }
    case "msgdel": if (await del("cvotes", id) !== false) { if (mode === "cloud") await cloudPull(false); redraw(); } break;
    case "vote": { const mv = cgMy(); if (await put("cvotes", `v:${id}:${mv}`, { kind: "vote", bill: id, vote: a.dataset.v, by: mv, at: new Date().toISOString() }) !== false) { if (mode === "cloud") await cloudPull(false); toast("Vote recorded"); redraw(); } break; }
    case "decide": { const b = S.bills[id]; if (!b || b.status !== "voting") break; const st = a.dataset.v;
      if (await put("bills", id, { ...b, status: st, note: ($("#cgNote-" + id)?.value || "").trim(), decidedBy: accName(me()), decidedTitle: role() === "council" ? me().title || "" : "Head of Volunteers", decidedAt: new Date().toISOString() }) !== false) {
        if (mode === "cloud") await cloudPull(false); cgDecideFx(st, b.title); redraw();
        pushSend([{ vids: cgSeats().map(m => m.id), title: st === "passed" ? "Bill passed" : "Bill not passed", body: b.title, tag: "bill" + id }]);
      } break; }
  }
});

  name: "Name", nameAr: "Arabic name", grade: "Grade", section: "Section", rank: "Rank", status: "Status", role: "Role", certHold: "Certificate hold", absher: "Absher", nafath: "Nafath" };

const AR_DATE = /\d{1,2} (?:يناير|فبراير|مارس|أبريل|مايو|يونيو|يوليو|أغسطس|سبتمبر|أكتوبر|نوفمبر|ديسمبر)(?: \d{4})?/g;
function trText(t) {

  const k = t.replace(/\s+/g, " ").trim(); if (!k) return null;
  if (AR_UI[k]) return AR_UI[k];
  // Dates are already Arabic (see below): "@" stands for one, "#" for any other number.
  const dates = [], nums = [], kk = k.replace(AR_DATE, m => (dates.push(m), "@")).replace(/\d+(?:[.,]\d+)?/g, m => (nums.push(m), "#"));
  if ((nums.length || dates.length) && AR_UI[kk]) { let i = 0, j = 0; return AR_UI[kk].replace(/#/g, () => nums[i++] ?? "").replace(/@/g, () => dates[j++] ?? ""); }
  // "Label · " style pieces: translate around the separators.
  if (/ · /.test(k)) { const parts = k.split(" · "), out = parts.map(p => trText(p)); if (out.some(Boolean)) return parts.map((p, i) => out[i] || p).join(" · "); }
  const m = k.match(/^(.*?)([:.,?!…]+)$/); if (m && m[1] && AR_UI[m[1]]) return AR_UI[m[1]] + m[2].replace(",", "،").replace("?", "؟");

}

/* ---------- Arabic text direction ---------- */
// Arabic typed into chats, bills, complaints and names reads right to left. Text fields follow what is typed;
// shown text that holds Arabic gets its own direction, so numbers and punctuation stay in the right place.
const AR_RE = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
function bidiFix(root) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll('input[type="text"]:not([dir]), input[type="search"]:not([dir]), input:not([type]):not([dir]), textarea:not([dir])').forEach(i => { i.dir = "auto"; });
  if (!AR_RE.test(root.textContent || "")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => AR_RE.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
  const L = []; while (w.nextNode()) L.push(w.currentNode);
  for (const n of L) {
    const p = n.parentElement;
    if (!p || p.closest('bdi,[dir="auto"],textarea,option,select,script,style,svg,title,.keybox')) continue;
    if (p.textContent.trim() === n.data.trim() && p.children.length === 0) p.dir = "auto";
    else { const b = document.createElement("bdi"); n.replaceWith(b); b.appendChild(n); }

}
