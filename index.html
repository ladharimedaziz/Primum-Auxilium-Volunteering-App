function bindOverlay() {
  $("#qForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const q = S.queries[ui.qId]; if (!q) return;
    const reply = $("#qReply").value.trim(); if (!reply) return $("#qReply").focus();
    const ok = await put("queries", ui.qId, { ...q, reply, public: $("#qPublic").checked, status: "answered", answeredBy: accName(me()), answeredAt: new Date().toISOString() });
    if (ok === false) return;
    if (q.vid && !q.reply) pushSend([{ vids: [q.vid], title: "Your question was answered", body: q.subject, tag: "q" + ui.qId }]);
    closeOverlay(); toast("Answer sent");
  });
  $("#cpReplyForm")?.addEventListener("submit", async e => {
    e.preventDefault(); const c = S.complaints[ui.cpId]; if (!c) return;
    await put("complaints", ui.cpId, { ...c, ...(c.anon ? {} : { reply: $("#cpReply").value.trim() }), note: $("#cpNote").value.trim(), status: c.status === "new" ? "review" : c.status });
    closeOverlay(); toast("Saved");
  });
  const imf = $("#impForm");
  if (imf) {
    const sync = () => { const t = impCount(), b = $("#impGo"); b.textContent = `Add ${t} volunteer${t === 1 ? "" : "s"}`; b.disabled = !t; $("#impNote").textContent = impNote(); };
    imf.addEventListener("change", e => {
      const c = e.target.closest("[data-impcls]"); if (c) ui.imp[c.dataset.impcls].cls = c.value;
      const k = e.target.closest("[data-imp]"); if (k) { const [bi, ni] = k.dataset.imp.split(":"); ui.imp[bi].names[ni].on = k.checked; }
      sync();
    });
    imf.addEventListener("submit", async e => {
      e.preventDefault(); const batches = ui.imp; ui.imp = null; closeOverlay();
      const by = {}; let n = 0;
      for (const b of batches) { if (!b.cls) continue; for (const x of b.names) if (x.on) {
        await put("volunteers", uid(), { name: x.n, grade: Number(b.cls.slice(0, 2)), section: b.cls[2], rank: "probationary", status: "active", notes: "", joined: todayISO() });
        n++; by[b.cls] = (by[b.cls] || 0) + 1; } }
      toast(`${n} added · ${Object.entries(by).map(([c, k]) => `${c} ${k}`).join(", ")}`);
    });
  }
  const vf = $("#volForm");
  if (vf) vf.addEventListener("submit", e => {
    e.preventDefault(); const name = $("#vName").value.trim(); if (!name) return $("#vName").focus();
    put("volunteers", uid(), { name, grade: Number($("#vGrade").value), section: $("#vSection").value, rank: $("#vRank").value, status: $("#vStatus").value, notes: $("#vNotes").value.trim(), joined: todayISO() });
    closeOverlay(); toast(`${name} added to the roster`);
  });
  const ph = $("#evPhoto");
  if (ph) {
    const take = async f => { if (!f || !/^image\//.test(f.type)) return toast("Choose an image file (JPG, PNG or WebP)."); await setEventPhoto(ui.evcId, f); };
    ph.addEventListener("change", e => take(e.target.files[0]));
    const dz = $("#photoDrop");
    dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("over"));
    dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); take(e.dataTransfer.files[0]); });
  }
  const ef = $("#evForm");
  if (ef) {
    const auto = () => { const h = hoursFromTimes($("#eStart").value, $("#eEnd").value); if (h) $("#eHours").value = h; };
    $("#eStart").addEventListener("change", auto); $("#eEnd").addEventListener("change", auto);
    $("#eExt").addEventListener("change", e => { const o = $("#eOrgWrap"); o.hidden = !e.target.checked; if (e.target.checked) $("#eOrg").focus(); });
    ef.addEventListener("submit", e => {
      e.preventDefault(); const title = $("#eTitle").value.trim(); if (!title) return $("#eTitle").focus();
      const id = ui.eventId || uid(), prev = S.events[id] || { signups: [], status: "open" };
      put("events", id, { ...prev, title, date: $("#eDate").value || todayISO(), start: $("#eStart").value, end: $("#eEnd").value, hours: r1(Number($("#eHours").value) || hoursFromTimes($("#eStart").value, $("#eEnd").value)), location: $("#eLoc").value.trim(), spots: Math.max(0, Number($("#eSpots").value) || 0), supervisor: $("#eSup").value.trim(), notes: $("#eNotes").value.trim(), external: $("#eExt").checked, organizer: $("#eOrg").value.trim() });
      closeOverlay(); toast(ui.eventId ? "Event updated" : "Event posted");
    });
  }
  const ap = $("#apForm");
  if (ap) {
    const have = () => eventRoster(S.events[ui.eventId]).confirmed.length;
    const sync = () => {
      const n = ap.querySelectorAll("[data-ap] input:checked").length, need = Math.max(0, leadsNeeded(S.events[ui.eventId], have() + n) - leadsOf(S.events[ui.eventId]).length);
      $("#apLeadNeed").textContent = need;
      return need;
    };
    $("#apN").addEventListener("input", e => {
      const n = Math.max(0, Number(e.target.value) || 0);
      ap.querySelectorAll("[data-ap] input").forEach((c, i) => { c.checked = i < n; });
      const need = sync(); ap.querySelectorAll("[data-apl] input").forEach((c, i) => { c.checked = i < need; });
    });
    ap.querySelectorAll("[data-ap] input").forEach(c => c.addEventListener("change", () => { $("#apN").value = ap.querySelectorAll("[data-ap] input:checked").length; sync(); }));
    ap.addEventListener("submit", async e => {
      e.preventDefault(); const ev = S.events[ui.eventId];
      const picked = [...ap.querySelectorAll("[data-ap] input:checked")].map(c => c.closest("[data-ap]").dataset.ap);
      const lead = [...ap.querySelectorAll("[data-apl] input:checked")].map(c => c.closest("[data-apl]").dataset.apl);
      // Someone picked as a lead leads instead; the next in line takes their volunteer spot.
      const add = picked.filter(x => !lead.includes(x)), rest = [...ap.querySelectorAll("[data-ap] input:not(:checked)")].map(c => c.closest("[data-ap]").dataset.ap).filter(x => !lead.includes(x));
      while (add.length < picked.length && rest.length) add.push(rest.shift());
      if (!add.length && !lead.length) return toast("Select at least one volunteer.");
      closeOverlay();
      await put("events", ui.eventId, { ...ev, signups: [...(ev.signups || []).filter(x => !lead.includes(x)), ...add.filter(x => !lead.includes(x))], leads: [...leadsOf(ev), ...lead] });
      toast(`Added ${add.length} volunteer${add.length === 1 ? "" : "s"}${lead.length ? ` · ${lead.length} shift lead${lead.length === 1 ? "" : "s"}` : ""}`);
    });
  }
  const scf = $("#scForm");
  if (scf) scf.addEventListener("submit", async e => {

/* ---------- motion: ripple, tilt, reveal, parallax ---------- */
(() => {
  if (reduced()) return;
  // Ink ripple from the press point on buttons and tappable cards.
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest("button,.btn,label.btn,.tab,.qa,.vrow,.post,.bcard,.rs-head,.chip.out,.attrow,.srow,.mev");
    if (!el || el.disabled) return;
    const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, ink = document.createElement("span");
    ink.className = "ripple"; ink.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    if (getComputedStyle(el).position === "static") el.style.position = "relative";
    el.classList.add("has-ripple"); el.appendChild(ink); setTimeout(() => ink.remove(), 650);
  }, { passive: true });
  // Gentle 3D tilt that follows the pointer on headline cards.
  const TILT = ".kpi,.post,.ccard,.vcert,.gate-card,.qa";
  let tilted = null;
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const el = e.target.closest(TILT);
    if (tilted && tilted !== el) { tilted.style.transform = ""; tilted = null; }
    if (!el) return;
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    el.style.transform = `perspective(900px) rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg) translateY(-2px)`;
    el.style.setProperty("--mx", `${(x + .5) * 100}%`); el.style.setProperty("--my", `${(y + .5) * 100}%`);
    tilted = el;
  }, { passive: true });
  document.addEventListener("pointerleave", () => { if (tilted) { tilted.style.transform = ""; tilted = null; } });
  // Panels below the fold rise in as they scroll into view.
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { rootMargin: "0px 0px -40px 0px" });
  new MutationObserver(() => document.querySelectorAll("#view .panel:not(.rv),#view .rgrp:not(.rv),#view .post:not(.rv),#view .msg:not(.rv)").forEach(el => {
    el.classList.add("rv"); if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("below"); io.observe(el); }
  })).observe($("#view"), { childList: true, subtree: true });

  addEventListener("scroll", () => { const y = Math.min(scrollY, 300); if (ghost) ghost.style.translate = `0 ${y * .25}px`; if (crest) crest.style.translate = `0 ${y * .08}px`; }, { passive: true });

const cImgCache = new Map();
async function cImg(ref) {
  if (!ref) return "";
  if (ref.startsWith("data:")) return ref;
  if (cImgCache.has(ref)) return cImgCache.get(ref);
  const p = (async () => { const t = await rpc("pa_file_get", { token: tok(), id: ref }); return t ? URL.createObjectURL(new Blob([unb64(t)], { type: "image/webp" })) : ""; })().catch(() => { cImgCache.delete(ref); return ""; });
  cImgCache.set(ref, p); return p;
}

// Photos are shrunk on the phone before sending: webp, longest side 1600 px online.
async function shrink(file, max = mode === "cloud" ? 1600 : 900) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  let q = .82, blob;
  do { blob = await new Promise(r => c.toBlob(r, "image/webp", q)); q -= .15; } while (blob && blob.size > 2.8e6 && q > .3);
  if (!blob) throw new Error("image");
  return { blob, w: c.width, h: c.height };
}
async function cUpload(file) {
  const { blob, w, h } = await shrink(file);
  if (mode !== "cloud") return { ref: await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }), w, h };
  const ref = "cc-" + uid();
  await rpc("pa_file_put", { token: tok(), id: ref, b64: await blobB64(blob) });
  cImgCache.set(ref, Promise.resolve(URL.createObjectURL(blob)));
  return { ref, w, h };
}

      ${id && w.updatedBy ? `<div class="muted" style="font-size:12.5px">Last change by ${esc(w.updatedBy)}${w.updatedAt ? " · " + new Date(w.updatedAt).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""}</div>` : ""}
      ${ui.confirm === "cw" ? `<div class="confirm"><span style="flex:1">Delete this ${esc(D.noun)}?</span><button type="button" class="btn small" data-cact="cw-keep">Keep</button><button type="button" class="btn small danger solid" data-cact="cw-del" data-id="${id}">Delete</button></div>` : ""}
      <div class="actions">${id && !ro && ui.confirm !== "cw" ? `<button type="button" class="btn danger" data-cact="cw-ask" data-id="${id}" style="margin-right:auto">Delete</button>` : ""}<button type="button" class="btn ghost" data-close>${ro ? "Close" : "Cancel"}</button>${ro ? "" : `<button class="btn primary" type="submit">${id ? "Save" : "Add"}</button>`}</div>
    </form></div>`;
}
function openWork(id, kind) { ui.confirm = null; ui.cwId = id; ui.cwKind = kind; ui.modal = () => workModal(ui.cwId, ui.cwKind); renderOverlay(); hydrate($("#overlayHost")); }
function muteModal(id) {
  const m = cMember(id);
  return `<div class="modal free" role="dialog" aria-label="Mute"><h2>Mute ${esc(m?.name || "")}</h2><p class="muted" style="margin:0 0 12px;font-size:14px">They can read the chat but can't post or send photos.</p>
    <form id="cMuteForm" class="stack-form" data-id="${id}"><label class="field">Reason (optional)<input type="text" id="cmReason" maxlength="300"></label>
    <label class="field">For<select id="cmFor"><option value="1">1 hour</option><option value="24">1 day</option><option value="72">3 days</option><option value="168">1 week</option><option value="0" selected>Until unmuted</option></select></label>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn danger solid" type="submit">Mute</button></div></form></div>`;
}

// Actions
async function sendMsg() {
  if (ui.cSending) return;
  const ta = $("#cText"), text = (ta?.value || "").trim(), pend = ui.cPending;
  if (!text && !pend) return;
  ui.cSending = true; const btn = $("#cForm .send"); btn && btn.classList.add("loading");
  try {
    let img = null;
    if (pend) img = await cUpload(pend.file);
    const id = uid(), msg = { ...myStamp(), ...(text ? { text } : {}), ...(img ? (img.ref.startsWith("data:") ? { imgData: img.ref } : { img: img.ref }) : {}), ...(img ? { w: img.w, h: img.h } : {}) };
    if (await put("cchat", id, msg) === false) return;
    ui.cDraft = ""; if (ui.cPending) URL.revokeObjectURL(ui.cPending.url); ui.cPending = null;
    $("#cComposer").innerHTML = composerHTML(); $("#cText")?.focus();
    pushSend([{ staff: true, title: "Council chat", body: `${cName(session.id)}: ${text ? text.slice(0, 120) : "📷 Photo"}`, tag: "cchat" }]);
  } catch (e) { toast(e && e.code === "muted" ? "You're muted." : "Couldn't send. Try again."); }
  finally { ui.cSending = false; btn && btn.classList.remove("loading"); }
}
function chatRefresh() {
  const L = $("#cMsgs"); if (!L) return;
  const near = L.scrollHeight - L.scrollTop - L.clientHeight < 120, html = msgsHTML();
  if (L.dataset.sig !== html) { L.dataset.sig = html; L.innerHTML = html; hydrate(L); if (near) L.scrollTop = L.scrollHeight; }
  const muted = !!muteOf(session.id), c = $("#cComposer");
  if (c && muted !== !!c.querySelector(".c-mutebar")) c.innerHTML = composerHTML();
  if (document.visibilityState === "visible") markRead();
}
function councilRefresh() {
  if (!C_TABS.some(t => t[0] === view)) return;
  if (view === "c-chat") return chatRefresh();
  const el = $("#view"), ae = document.activeElement;
  if (ae && el.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  const html = VIEWS[view](); if (el.dataset.csig === html) return;
  el.dataset.csig = html; el.innerHTML = html; hydrate(el);
}
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-cact]"); if (!a) return;
  const id = a.dataset.id, k = a.dataset.k;
  switch (a.dataset.cact) {
    case "realm": switchRealm(a); break;
    case "new": openWork(null, k); break;
    case "open": if (S.cwork[id]) openWork(id, S.cwork[id].kind); break;
    case "desk": ui.desk = k; $("#view").innerHTML = VIEWS["c-desk"](); hydrate(); break;
    case "desk-go": ui.desk = k; go("c-desk"); break;
    case "tf": ui.cTaskF = k; $("#view").innerHTML = VIEWS["c-tasks"](); break;
    case "cw-ask": ui.confirm = "cw"; renderOverlay(); break;
    case "cw-keep": ui.confirm = null; renderOverlay(); break;
    case "cw-del": { const w = S.cwork[id]; closeOverlay(); if (await del("cwork", id) !== false) toast(`Deleted ${w ? DESKS[w.kind].noun : ""}`); break; }
    case "copy-field": { const t = $("#cw-" + k)?.value || ""; try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { toast("Select the text and copy it"); } break; }
    case "mute": if (canMute(id)) { ui.modal = () => muteModal(id); renderOverlay(); } break;
    case "unmute": if (await del("cmutes", id) !== false) toast(`${cName(id)} unmuted`); break;
    case "msg-del": if (await del("cchat", id) !== false) toast("Message deleted"); break;
    case "img-clear": URL.revokeObjectURL(ui.cPending?.url || ""); ui.cPending = null; $("#cComposer").innerHTML = composerHTML(); break;
    case "zoom": { const src = a.src; if (!src) break; ui.modal = () => `<div class="modal lightbox free" data-close><img src="${src}" alt=""></div>`; renderOverlay(); break; }
    case "ledger-csv": {
      const data = csv([["Date", "Description", "Type", "Amount (SAR)", "Category", "Event", "Status", "Receipt"], ...work("ledger").sort((x, y) => (x.date || "").localeCompare(y.date || "")).map(x => [x.date || "", x.title || "", x.type || "", x.amount || 0, x.cat || "", x.event || "", x.status || "Pending", x.receipt ? "Yes" : "No"])]);
      try { await downloads.save({ filename: `student-council-finance-${todayISO()}.csv`, data }); } catch { try { await navigator.clipboard.writeText(data); toast("CSV copied"); } catch { toast("Export failed"); } }
      break;
    }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "cForm") { e.preventDefault(); return sendMsg(); }
  if (f.id === "cMuteForm") {
    e.preventDefault(); const id = f.dataset.id, h = Number($("#cmFor").value), reason = $("#cmReason").value.trim();
    const ok = await put("cmutes", id, { by: session.id, byName: role() === "head" ? "Head of Volunteers" : cName(session.id), byRole: role(), ...(reason ? { reason } : {}), at: new Date().toISOString(), ...(h ? { until: new Date(Date.now() + h * 3600e3).toISOString() } : {}) });
    if (ok !== false) { closeOverlay(); toast(`${cName(id)} muted`); }
    return;
  }
  if (f.id === "cwForm") {
    e.preventDefault(); const id = f.dataset.id || uid(), kind = f.dataset.kind, D = DESKS[kind], old = S.cwork[id] || {};
    if (!canDesk(kind)) return toast("View only");
    const o = { ...old, kind, status: $("#cw-status").value };
    const sb = f.querySelector("button[type=submit]"); sb.disabled = true; sb.classList.add("loading");
    try {
      for (const fd of D.fields) {
        const el = $("#cw-" + fd.k);
        if (fd.type === "checks" || fd.type === "members") o[fd.k] = [...el.querySelectorAll("input:checked")].map(x => x.value);
        else if (fd.type === "image") { if (el && el.files[0]) o[fd.k] = (await cUpload(el.files[0])).ref; }
        else if (fd.type === "number") o[fd.k] = el.value === "" ? null : Number(el.value);
        else o[fd.k] = el.value.trim();
      }
      if (!f.dataset.id) Object.assign(o, { by: session.id, byName: cName(session.id) });
      Object.assign(o, { updatedBy: cName(session.id), updatedAt: new Date().toISOString() });
      if (await put("cwork", id, o) === false) return;
      closeOverlay(); toast(f.dataset.id ? "Saved" : `${D.noun[0].toUpperCase() + D.noun.slice(1)} added`);
      if (kind === "task" && o.who && o.who !== session.id && o.who !== old.who) pushSend([{ staff: true, title: "Council task", body: `${cName(o.who)}: ${o.title}`, tag: "ctask" }]);
    } catch { toast("Couldn't save. Try again."); }
    finally { sb.disabled = false; sb.classList.remove("loading"); }
  }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "cFile") return;
  const file = e.target.files[0]; if (!file) return;
  if (!/^image\//.test(file.type)) return toast("Photos only");
  if (ui.cPending) URL.revokeObjectURL(ui.cPending.url);
  ui.cDraft = $("#cText")?.value || ""; ui.cPending = { file, url: URL.createObjectURL(file) };
  $("#cComposer").innerHTML = composerHTML(); $("#cText")?.focus();
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "cText") return;
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer:fine)").matches) { e.preventDefault(); sendMsg(); }
});
document.addEventListener("input", e => { if (e.target.id === "cText") { ui.cDraft = e.target.value; e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; } });
document.addEventListener("paste", e => {
  if (e.target.id !== "cText" || muteOf(session?.id)) return;
  const f = [...(e.clipboardData?.files || [])].find(x => /^image\//.test(x.type)); if (!f) return;
  e.preventDefault(); ui.cDraft = e.target.value; ui.cPending = { file: f, url: URL.createObjectURL(f) }; $("#cComposer").innerHTML = composerHTML(); $("#cText")?.focus();
});
// The chat refreshes faster while it is open.
setInterval(() => { if (mode === "cloud" && session && view === "c-chat" && !document.hidden) cloudPull(false); }, 3e3);
// Header stars for the council theme.
(() => { const band = $("header.band"); if (!band) return; const s = document.createElement("div"); s.className = "cstars"; s.setAttribute("aria-hidden", "true");
  s.innerHTML = [[8, 18, 16], [22, 70, 10], [38, 30, 12], [55, 78, 9], [68, 22, 18], [80, 64, 12], [92, 30, 14], [47, 55, 7], [74, 85, 8], [15, 82, 9]].map(([x, y, z], i) => `<i style="left:${x}%;top:${y}%;--s:${z}px;--t:${2.5 + (i % 4) * .7}s"></i>`).join(""); band.prepend(s); })();

addEventListener("resize", moveInk);
addEventListener("scroll", () => $("#tabbar").classList.toggle("stuck", scrollY > 150), { passive: true });
document.fonts && document.fonts.ready.then(moveInk);
boot();
})();
</script>
