.replies{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:28px;padding-left:10px}
.attach{margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;max-width:560px}

.attach-info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.file-ic{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--danger);color:#fff;border-radius:4px;padding:2px 6px}
.fname{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;color:var(--ink)}
.evc-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.photo-drop{width:180px;height:120px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);background:var(--sunk);overflow:hidden;flex:none;transition:border-color .2s,background .2s}
.photo-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.photo-drop img{max-width:100%;max-height:100%;object-fit:contain}
.evc-list{display:flex;flex-direction:column;margin-top:14px;max-height:260px;overflow:auto}

.role{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px;margin-left:8px;vertical-align:2px}
.avatar{width:42px;height:46px;border-radius:0;clip-path:polygon(0 0,100% 0,100% 58%,93% 75%,77% 89%,50% 100%,23% 89%,7% 75%,0 58%);padding-bottom:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--accent-soft);color:var(--accent)}

@media (max-width:760px){

  .vrow .avatar{grid-area:av}.vrow .nmcell{grid-area:nm}.vrow .gcell{grid-area:gr;align-items:flex-end}.vrow .stcell{grid-area:st}.vrow .prog{grid-area:pr}
}

/* Log form */
.logwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.logwrap{grid-template-columns:minmax(0,1fr)}}
form.stack-form{display:flex;flex-direction:column;gap:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-family:var(--f-mono);font-weight:600;cursor:pointer;font-size:13px}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.rule.block{background:var(--danger-soft);color:var(--ink)}

/* Reports */
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.rcard{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s;width:100%;font:inherit;color:inherit}
.rcard:hover{transform:translateY(-2px)}
.rcard h3{font-size:17px;font-weight:700}

.rcard .foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:auto}
.picklist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--sunk);display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px}

/* Settings */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;align-items:start}
.slist{display:flex;flex-direction:column;gap:6px}

/* Overlay: modal + drawer */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:rise .35s cubic-bezier(.2,1.2,.4,1)}
.modal h2{font-size:22px;font-weight:800;margin-bottom:14px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.overlay.side{justify-content:flex-end;padding:0}
.drawer{background:var(--surface);width:min(460px,100%);min-height:100%;padding:24px max(20px,env(safe-area-inset-right,0px)) 40px 22px;border-left:1px solid var(--line);animation:slide .4s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column;gap:18px}
.drawer .top{display:flex;gap:14px;align-items:center}
.drawer .top h2{font-size:24px;font-weight:800}
.drawer .avatar{width:56px;height:62px;font-size:20px}
.big-h{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.entries{display:flex;flex-direction:column}
.entries .e{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.entries .e .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.iconbtn:hover{color:var(--danger);background:var(--danger-soft)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--danger-soft);font-size:14px}

/* Toast */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:toast .4s cubic-bezier(.2,1.3,.4,1)}
.toast.out{animation:toastout .3s forwards}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}

/* Motion: entrances run only on view change; at rest everything is visible. */
.enter .st > *{animation:rise .55s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.enter .bar > i,.enter .stack > i{animation:grow 1.1s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(200ms + var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastout{to{opacity:0;transform:translateY(10px)}}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}

/* ---------- v2: depth, motion, new views ---------- */
body{background:radial-gradient(1100px 520px at 88% -8%,color-mix(in srgb,var(--slate) 16%,transparent),transparent 62%),radial-gradient(900px 480px at -12% 28%,color-mix(in srgb,var(--navy) 9%,transparent),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.tabbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);transition:box-shadow .3s}
.tabbar.stuck{box-shadow:0 10px 24px -18px rgba(10,20,40,.55)}
body.gated .tabbar{display:none}
.tab .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;vertical-align:1px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.panel{transition:box-shadow .3s,transform .3s,border-color .3s}
.kpi:hover,.ecard:hover,.post:hover,.vcert:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 22px 44px -22px rgba(20,32,62,.5)}
.btn{transition:transform .15s,background .2s,border-color .2s,box-shadow .2s,filter .2s}
.btn.primary{box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.big{width:100%;justify-content:center;padding:12px 16px;font-size:15.5px}
.btn.loading{pointer-events:none;color:transparent!important;position:relative}
.btn.loading::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-ink);border-right-color:transparent;animation:spin .7s linear infinite}
.overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.overlay.closing{animation:fadeout .23s forwards;pointer-events:none}
.overlay.closing .modal{animation:sink .23s forwards}
.overlay.closing .drawer{animation:slideout .23s forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes sink{to{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes slideout{to{opacity:0;transform:translateX(50px)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
.num.bump,[data-count].bump{color:var(--accent)}
.vrow.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}}
.skel{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.sk{background:linear-gradient(90deg,var(--sunk) 0%,color-mix(in srgb,var(--sunk) 40%,var(--surface)) 50%,var(--sunk) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:14px;height:110px}
.sk-h{height:28px;width:240px}.sk-b{height:260px}.sk-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

/* greeting */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello-name{font-size:clamp(26px,4vw,36px);letter-spacing:.02em;margin-top:2px}
.quick-acts{display:flex;gap:8px;flex-wrap:wrap}
.qa{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.qa:hover{transform:translateY(-2px);border-color:var(--slate)}
.qa .qi{width:1.1em;text-align:center;color:var(--slate)}
/* roster groups */
.rgrp{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}

.rg-head .cnt,.rs-head .cnt{font-size:13px;color:var(--muted);margin-left:auto}
.rs-flat{display:flex;flex-direction:column;gap:8px}

.rs-head:hover{background:var(--sunk)}
.rs-head .cnt{margin-left:0}
.bar.mini{flex:1;max-width:200px;margin-left:auto;height:6px}

.rs-rows>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.rsec.shut .rs-rows{grid-template-rows:0fr}
.rsec.shut .rs-rows>div{padding-bottom:0}
.gov{display:inline-flex;gap:4px;margin-right:6px;vertical-align:1px}
.gv{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}

.gov-miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gov-miss .vchip{cursor:pointer;border:0}
/* drop zone */
#view.dropping{outline:2px dashed var(--slate);outline-offset:6px;border-radius:16px}
#view.dropping::after{content:"Drop to import";position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);z-index:40}
.drop-hint{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px}
/* import */
.impb{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.impb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.inline-field{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.impnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;max-height:260px;overflow:auto}

.fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* checks */
.checkrow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.checkrow input{margin-top:3px}
.checkrow span{display:flex;flex-direction:column}
.checkrow small{color:var(--muted);font-size:12.5px}
.att-sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:14px}
/* external / files */
.tag.ext{background:var(--navy);color:#fff}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.fileatt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px;min-width:0}
.fileatt .fmeta{display:flex;flex-direction:column;min-width:0;flex:1;font-size:13.5px}
.fileatt .fmeta .muted{font-size:12px}
.fileatt .fbtns{display:flex;gap:6px;align-items:center}
.loose{margin:12px 0}
.loose-row{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:center}
@media (max-width:640px){.loose-row{grid-template-columns:1fr}}
/* gate */
.gate{min-height:calc(100vh - 220px);display:grid;place-items:center;padding:24px 0}
.gate-card{width:min(400px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 24px;text-align:center}
.gate-card form{width:100%;text-align:left}
.gate-crest{height:96px;width:auto;filter:drop-shadow(0 8px 18px rgba(20,30,60,.3));animation:crestIn .9s cubic-bezier(.2,1.3,.4,1) both}
.gate-card h2{font-size:24px}
.gate-sub,.gate-note{margin:0;font-size:13.5px}
.gerr{min-height:18px;color:var(--danger);font-size:13.5px;font-weight:700}

@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.keybox{font-size:22px;letter-spacing:.08em;padding:14px 18px;border-radius:12px;background:var(--sunk);border:1px dashed var(--slate);user-select:all;word-break:break-all}
.chip.who{background:rgba(255,255,255,.14)}
.chip.out{border:0;cursor:pointer;background:rgba(255,255,255,.08);color:var(--band-ink);font:inherit;font-size:12.5px;font-weight:700}
.chip.out:hover{background:rgba(255,255,255,.2)}
/* read-only roles */
body.ro [data-act="add-vol"],body.ro [data-act="import"],body.ro [data-act="new-event"],body.ro [data-act="edit-event"],body.ro [data-act="attendance"],body.ro [data-act="ev-signup"],body.ro [data-act="ev-remove"],body.ro [data-act="promote"],body.ro [data-act="promo-skip"],body.ro [data-act="new-report"],body.ro [data-act="verify-entry"],body.ro [data-act="del-entry"],body.ro [data-act="log-for"],body.ro [data-act="event-certs"],body.ro [data-act="pdf-pick"],body.ro [data-act="pdf-del"],body.ro [data-act="clear-examples"],body.ro [data-act="weekly"],body.ro [data-act="ask-del-vol"],body.ro [data-go="log"],body.ro .signup,body.ro .drop-hint,body.ro [data-assign]{display:none!important}
body.ra [data-act="add-vol"],body.ra [data-act="import"],body.ra [data-act="attendance"],body.ra [data-act="promote"],body.ra [data-act="promo-skip"],body.ra [data-act="new-report"],body.ra [data-act="verify-entry"],body.ra [data-act="del-entry"],body.ra [data-act="log-for"],body.ra [data-act="event-certs"],body.ra [data-act="pdf-pick"],body.ra [data-act="pdf-del"],body.ra [data-act="clear-examples"],body.ra [data-act="weekly"],body.ra [data-act="ask-del-vol"],body.ra [data-go="log"]{display:none!important}
/* volunteer views */
.me-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.me-hero{grid-column:1/-1}
.mini-events{display:flex;flex-direction:column;gap:10px}
.mev{display:flex;align-items:center;gap:12px;min-width:0}
.vcert{margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.cp-sent{padding:10px 0;border-bottom:1px solid var(--line)}
.cp-sent:last-child{border-bottom:0}
.cp-reply{margin-top:8px;padding:8px 10px;border-left:3px solid var(--slate);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px;display:flex;flex-direction:column;gap:2px}
.policy{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--sunk);padding:10px 12px;border-radius:10px}
/* inbox board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.bcol{background:color-mix(in srgb,var(--sunk) 70%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;transition:background .2s,border-color .2s}
.bcol.over{border-color:var(--slate);background:var(--accent-soft)}
.bcol-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.bcard{display:flex;flex-direction:column;gap:5px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:grab;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;font:inherit;color:inherit;min-width:0}
.bcard:hover{transform:translateY(-2px)}
.bcard.unread{border-left:4px solid var(--warn)}
.bcard.dragging{opacity:.4}
.bc-top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.bcard .clip{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-from{font-size:12px;font-weight:700;color:var(--slate)}
.bempty{font-size:13px;color:var(--muted);text-align:center;padding:18px 0}
.cp-body{white-space:pre-wrap;background:var(--sunk);padding:12px 14px;border-radius:10px;font-size:14.5px}
/* handbook */
.hb-wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hb-seg{align-self:center}
.handbook{padding:28px clamp(18px,4vw,40px)}
.hb-head{display:flex;gap:16px;align-items:center;padding-bottom:18px;border-bottom:2px solid var(--line);margin-bottom:8px}
.hb-head img{height:72px;width:auto}
.hb-head h2{font-size:clamp(24px,3.4vw,32px)}
ol.hb{list-style:none;counter-reset:hb;margin:0;padding:0}
ol.hb>li{counter-increment:hb;position:relative;padding:18px 0 18px 54px;border-bottom:1px solid var(--line)}
ol.hb>li:last-child{border-bottom:0}
ol.hb>li::before{content:counter(hb);position:absolute;left:0;top:16px;width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
ol.hb h3{font-size:18px;margin-bottom:6px}
ol.hb p{margin:4px 0}
ol.hb ul{margin:4px 0;padding-left:18px}
ol.hb li li{margin:3px 0}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.chain span{padding:4px 10px;border-radius:999px;background:var(--sunk);font-weight:700;font-size:13px}
.chain span:last-child{background:var(--navy);color:#fff}
.chain i{color:var(--muted);font-style:normal}
.hb3,.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:6px}
.hb3>div,.steps3>div{background:var(--sunk);border-radius:12px;padding:12px}
.hb3 ul{padding-left:16px}
.steps3>div{display:flex;gap:10px;align-items:flex-start}
.steps3 b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-size:13px}
.pills4{display:flex;flex-wrap:wrap;gap:8px}
.pills4 span{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13.5px}
.hb-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.hb-table th,.hb-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.hb-table th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hb-table td:first-child{font-weight:700;white-space:nowrap}
.hb-foot{margin-top:14px;padding-top:14px;border-top:2px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.signin-edit{display:flex;gap:6px;flex-wrap:wrap}
.signin-edit input{flex:1;min-width:160px}
@media print{header.band,.rim,.tabbar,.hb-seg,#toasts{display:none!important}body{background:#fff}.handbook{box-shadow:none;border:0}}

/* ---------- motion v3 ---------- */
:root{--spring:cubic-bezier(.2,1.25,.35,1);--ease:cubic-bezier(.2,.9,.2,1)}
.has-ripple{overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:ripple .65s var(--ease) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.kpi,.post,.ccard,.vcert,.gate-card,.qa{transition:transform .35s var(--ease),box-shadow .35s,border-color .3s;will-change:transform}
.kpi::after,.post::after,.vcert::after,.gate-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 45%);opacity:0;transition:opacity .3s}
.kpi:hover::after,.post:hover::after,.vcert:hover::after,.gate-card:hover::after{opacity:1}
.kpi,.post,.vcert,.gate-card{position:relative}
/* view transitions: slide in the direction of travel */
::view-transition-old(root){animation:vt-out .26s var(--ease) both}
::view-transition-new(root){animation:vt-in .38s var(--ease) both}
html[data-dir="back"]::view-transition-old(root){animation-name:vt-out-b}
html[data-dir="back"]::view-transition-new(root){animation-name:vt-in-b}
@keyframes vt-out{to{opacity:0;transform:translateX(-24px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(32px)}}
@keyframes vt-out-b{to{opacity:0;transform:translateX(24px)}}
@keyframes vt-in-b{from{opacity:0;transform:translateX(-32px)}}
.band,.rim,.tabbar{view-transition-name:none}
header.band{view-transition-name:band}.tabbar{view-transition-name:tabs}
::view-transition-group(band),::view-transition-group(tabs){animation:none}
/* scroll reveal */
.rv.below{opacity:0;transform:translateY(22px) scale(.985)}
.rv.below.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .7s var(--spring)}
/* bars: live shimmer on unfinished progress */
.bar>i{position:relative;overflow:hidden}
.bar:not(.done)>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:barshine 2.8s 1.2s ease-in-out infinite}
@keyframes barshine{60%,100%{transform:translateX(100%)}}
.ringwrap .meter{filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
/* hero sheen */
.kpi.hero{overflow:hidden}
.kpi.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 3.2s 1s ease-in-out infinite;pointer-events:none}
/* tabs */
.tab{transition:color .25s,transform .25s var(--spring)}
.tab:hover{transform:translateY(-1px)}
.tab-ink{box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
/* drawer + modal content stagger */
.drawer>*{animation:rise .5s var(--ease) both}
.drawer>*:nth-child(2){animation-delay:.05s}.drawer>*:nth-child(3){animation-delay:.1s}.drawer>*:nth-child(4){animation-delay:.14s}.drawer>*:nth-child(5){animation-delay:.18s}.drawer>*:nth-child(n+6){animation-delay:.22s}
.modal{animation:modalIn .45s var(--spring)}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.94)}}
.overlay.closing .drawer>*{animation:none}
/* rows */
.vrow{transition:transform .3s var(--spring),border-color .2s,box-shadow .3s,background .3s}
.vrow:hover{transform:translateY(-2px) scale(1.004)}
.vrow:active{transform:scale(.99)}
.avatar{transition:transform .4s var(--spring)}
.vrow:hover .avatar,.msg:hover .avatar{transform:rotate(-6deg) scale(1.06)}
.bcard{transition:transform .3s var(--spring),box-shadow .3s}
.bcard:hover{transform:translateY(-3px) rotate(-.4deg)}
/* toasts with a timer line */
.toast{position:relative;overflow:hidden;animation:toast .5s var(--spring)}
.toast>i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--slate);transform-origin:left;animation:toastbar 2.8s linear forwards}
@keyframes toastbar{to{transform:scaleX(0)}}
/* header */
.crest{transition:translate .1s linear}
.band .ghost{transition:translate .1s linear}
.crest:hover{animation:crestWiggle .8s var(--spring)}
@keyframes crestWiggle{30%{transform:rotate(-5deg) scale(1.05)}60%{transform:rotate(3deg)}}
/* gate */
.gate-card>*{animation:rise .6s var(--ease) both}
.gate-card>*:nth-child(2){animation-delay:.06s}.gate-card>*:nth-child(3){animation-delay:.1s}.gate-card>*:nth-child(4){animation-delay:.14s}.gate-card>*:nth-child(n+5){animation-delay:.2s}
.gate-crest{animation:crestIn .9s var(--spring) both,float 6s 1s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
/* section collapse chevron + quick actions */
.qa .icx,.qa .qi{transition:transform .35s var(--spring)}
.qa:hover .icx,.qa:hover .qi{transform:scale(1.25) rotate(-8deg)}
.pill{transition:transform .25s var(--spring)}
.vrow:hover .pill{transform:scale(1.05)}
html.calm .rv.below{opacity:1;transform:none}
.gov-bars .gbar{grid-template-columns:70px minmax(0,1fr) auto}

/* partners */
.credits{display:flex;justify-content:center;gap:clamp(18px,5vw,56px);flex-wrap:wrap;padding-block:22px 40px;border-top:1px solid var(--line);margin-top:8px}
.cr{display:flex;align-items:center;gap:12px}
.cr img{height:54px;width:auto;transition:transform .4s var(--spring)}
.cr img.moe{height:46px}
.cr.side{opacity:.8;gap:9px}
.cr.side img{height:34px}
.cr.side img.ataa{height:38px}
.cr.side small{font-size:9.5px}
.cr.side b{font-size:12px}
.cr:hover img{transform:scale(1.08) rotate(-3deg)}
.cr span{display:flex;flex-direction:column;line-height:1.25}
.cr small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cr b{font-size:14px}
.gate-partners{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:8px;padding-top:14px;border-top:1px solid var(--line);width:100%}
.gate-partners img{height:44px;width:auto;opacity:.92}
.gate-partners img.moe{height:38px}
.gate-partners img.side{height:26px;opacity:.7}
.hb-credit{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;font-size:12.5px;line-height:1.4}
.hb-credit img{height:48px;width:auto}
.hb-credit img.moe{height:40px}
.hb-credit img.side{height:30px;opacity:.8}
@media print{.credits{display:flex!important}}

/* staffing */
.vchip.lead{background:var(--navy);color:#fff}.vchip.lead small{opacity:.75}.vchip.lead .star{color:#E9C46A}
.vchip.lead .iconbtn{color:#fff}
.tag.sc{background:var(--teal-soft);color:var(--teal)}.tag.lead{background:var(--navy);color:#fff}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.leads{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--sunk)}
.leads-head,.staff-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.staff-head{justify-content:space-between}
.ap-list{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.attrow.ap{cursor:pointer;grid-template-columns:auto 1fr auto}
body.ro .staff-head,body.ro [data-act="ev-unlead"],body.ro [data-act="ev-auto"]{display:none!important}

pre.ann{white-space:pre-wrap;font:14px/1.55 var(--f-body);background:var(--sunk);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.ann-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ann-photo{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:10px;object-fit:cover}
.srow .tag{white-space:nowrap}

/* ---------- motion v4: every control ---------- */
button,.btn,.chip,.iconbtn,.linkbtn,.tab,.seg button,label.btn,.tag,.vchip{transition:transform .22s var(--spring),box-shadow .25s,background-color .25s,color .2s,opacity .2s,border-color .2s}
button:not(:disabled):active,.btn:not(:disabled):active,label.btn:active,.chip.out:active{transform:scale(.94)}
.btn:not(:disabled):hover,label.btn:hover{transform:translateY(-1px)}
.btn.primary:not(:disabled):hover{box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.iconbtn:hover{transform:rotate(90deg) scale(1.1)}
.linkbtn:hover{letter-spacing:.01em}
.seg button[aria-pressed=true]{animation:segIn .35s var(--spring)}
@keyframes segIn{from{transform:scale(.9)}}
input,select,textarea{transition:border-color .2s,box-shadow .25s,background-color .25s,transform .2s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.field:focus-within{color:var(--accent)}
.flash{animation:flash .6s var(--ease)}
@keyframes flash{30%{background-color:color-mix(in srgb,var(--accent) 14%,var(--surface))}}
.tick input[type=checkbox],input[type=checkbox].tick{animation:tickPop .4s var(--spring)}
.tick{animation:rowTick .5s var(--ease)}
@keyframes tickPop{40%{transform:scale(1.35)}}
@keyframes rowTick{30%{background-color:color-mix(in srgb,var(--ok) 10%,transparent)}}
.pulse{animation:pulse .7s var(--spring)}
@keyframes pulse{30%{transform:scale(.95)}60%{transform:scale(1.04);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 18%,transparent)}}
[data-act$="copy"].done{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.in-k{animation:rise .45s var(--ease) both;animation-delay:calc(var(--k,0) * 28ms)}
.enter .srow,.enter .mev,.enter .attrow,.enter .e,.enter .cp-sent,.enter .vchip{animation:rise .5s var(--ease) both}
.enter .ecard,.enter .vcert,.enter pre.ann{animation:rise .55s var(--spring) both;animation-delay:calc(var(--i,0) * 50ms)}
.srow,.mev,.e,.cp-sent{transition:background-color .25s,transform .25s var(--spring)}
.srow:hover,.mev:hover,.e:hover{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.mev:hover{transform:translateX(3px)}
.leads{transition:box-shadow .3s}.leads:hover{box-shadow:inset 0 0 0 1px var(--line)}
.vchip.lead .star{display:inline-block;animation:spinIn .7s var(--spring) both}
@keyframes spinIn{from{transform:rotate(-180deg) scale(0)}}
.tag{display:inline-block}.tag.warn{animation:nudge 2.4s 1s ease-in-out infinite}
@keyframes nudge{0%,90%,100%{transform:none}93%{transform:translateX(-2px)}96%{transform:translateX(2px)}}
pre.ann{transition:box-shadow .3s,transform .3s var(--spring)}pre.ann:hover{box-shadow:inset 0 0 0 1px var(--line);transform:translateY(-1px)}
.ann-photo{animation:rise .6s var(--ease) both}
.gate-card .btn.primary{position:relative;overflow:hidden}


/* tab change */
#view{will-change:transform,opacity}
#view.tab-out-fwd{animation:tabOutF .16s ease-in both}#view.tab-out-back{animation:tabOutB .16s ease-in both}
#view.tab-in-fwd{animation:tabInF .5s cubic-bezier(.2,1,.3,1) both}#view.tab-in-back{animation:tabInB .5s cubic-bezier(.2,1,.3,1) both}
@keyframes tabOutF{to{opacity:0;transform:translateX(-40px) scale(.985);filter:blur(3px)}}
@keyframes tabOutB{to{opacity:0;transform:translateX(40px) scale(.985);filter:blur(3px)}}
@keyframes tabInF{from{opacity:0;transform:translateX(64px) scale(.985);filter:blur(4px)}}
@keyframes tabInB{from{opacity:0;transform:translateX(-64px) scale(.985);filter:blur(4px)}}
.tab[aria-selected=true]{animation:tabPick .45s var(--spring)}
@keyframes tabPick{40%{transform:translateY(-2px) scale(1.06)}}
.motion-btn{min-width:30px;justify-content:center}

.notice-panel{border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:0 10px 30px -14px color-mix(in srgb,var(--accent) 60%,transparent);margin-bottom:16px;animation:noticeIn .6s var(--spring) both}
.notice-panel .bell{display:inline-block;animation:ring 1.2s .4s ease-in-out 2}
@keyframes ring{10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}50%{transform:none}}
@keyframes noticeIn{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.notice-panel.bye{animation:noticeOut .38s ease-in both}@keyframes noticeOut{to{opacity:0;transform:translateY(-10px) scale(.96);height:0;margin:0;padding:0}}
.nmev.lead .edate{background:var(--navy);color:#fff}.nmev.out{opacity:.7}
.tab .badge{animation:pop .4s var(--spring)}

.gate-links{display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap}

[dir="auto"]:not(input):not(textarea){text-align:start}bdi{unicode-bidi:isolate}
.hx-top{display:flex;gap:12px;align-items:flex-start}.hx-ch{margin:8px 0 0;padding-inline-start:18px;font-size:14px}.hx-ask{display:flex;gap:6px;flex-wrap:wrap}
.hx-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}.hx-filters input{flex:1;min-width:200px}
.drafted{box-shadow:inset 3px 0 0 var(--brass,#b08d3c)}
body.gated .foot-links{display:none}

.priv-wrap{text-align:start;



font-size:14px;line-height:1.5}.priv-wrap h3{font-size:15px;margin:14px 0 4px}.priv{margin:0;padding-inline-start:18px}.priv li{margin:3px 0}

/* ---------- Student Council hub: maroon, black, white and grey with stars ---------- */
/* Administration wears purple. */
body[data-role="admin"]{--accent:#5B3A99;--accent-ink:#FFFFFF;--accent-soft:#E9E1F5;--navy:#4A2C82;--slate:#6D5F8A;--silver:#CFC8DD;--band-ink:#F3EFFA;--bg:#F1EEF7;--sunk:#E7E1F1;--line:#D8D0E6;--muted:#5E5873;--blue:#6A4C9C;--blue-soft:#E9E1F5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-role="admin"]{--accent:#C3AEEC;--accent-ink:#17102B;--accent-soft:#2B2145;--navy:#2A1D4D;--slate:#6D5F8A;--silver:#A79DBE;--band-ink:#EEE8FA;--bg:#110C1E;--surface:#1A1330;--sunk:#150F27;--line:#33284F;--muted:#A79DBE;--knock:#1A1330;--blue:#B79BE6;--blue-soft:#2B2145}}
:root[data-theme="dark"] body[data-role="admin"]{--accent:#C3AEEC;--accent-ink:#17102B;--accent-soft:#2B2145;--navy:#2A1D4D;--slate:#6D5F8A;--silver:#A79DBE;--band-ink:#EEE8FA;--bg:#110C1E;--surface:#1A1330;--sunk:#150F27;--line:#33284F;--muted:#A79DBE;--knock:#1A1330;--blue:#B79BE6;--blue-soft:#2B2145}
body[data-role="admin"] header.band{background:radial-gradient(120% 140% at 0% 0%,#6A44B0 0%,var(--navy) 46%,#1B0F38 100%)}
/* Congress */
.cg-hemi{position:relative;width:100%;aspect-ratio:2/1.05;margin:6px 0 4px;background:radial-gradient(60% 90% at 50% 100%,var(--accent-soft),transparent 70%);border-radius:20px 20px 0 0}
.cg-podium{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);padding:6px 16px;border-radius:10px 10px 4px 4px;background:var(--navy);color:var(--band-ink);font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.cg-seat{position:absolute;transform:translate(-50%,-50%);width:var(--sz);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(9px,1.7vw,14px) var(--f-body);border:2px dashed var(--line);color:var(--muted);background:transparent;padding:0;cursor:default}
.cg-seat.on{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;animation:cgIn .55s var(--spring) both;animation-delay:calc(var(--k)*28ms)}
.cg-seat.on:hover,.cg-seat.sel{box-shadow:0 0 0 4px var(--accent-soft);z-index:2}
.cg-seat.fresh{animation:cgIn .7s var(--spring) both,cgGlow 1.8s ease-out 1}
@keyframes cgIn{from{opacity:0;transform:translate(-50%,-150%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes cgGlow{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 22px transparent}}
.cg-bar{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.cg-bar i{display:block;height:100%;transform-origin:left;animation:cgGrow .8s var(--ease) both}
.cg-bar .y{background:var(--ok)}.cg-bar .n{background:var(--danger)}.cg-bar .a{background:var(--silver)}
@keyframes cgGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cg-bill{border-left:4px solid var(--accent)}.cg-bill.passed{border-left-color:var(--ok)}.cg-bill.rejected{border-left-color:var(--danger)}
.cg-fx{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(10,8,20,.72);animation:cgFxIn .35s ease both}
.cg-fx.out{animation:cgFxOut .5s ease both}
.cg-fx .card{background:var(--surface);color:var(--ink);border-radius:22px;padding:28px 34px;text-align:center;max-width:min(88vw,380px);animation:cgCard .8s var(--spring) both;box-shadow:0 30px 80px -20px #000}
.cg-fx .chair{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 30px var(--f-display);animation:cgGlow 1.4s ease-out .5s 2}
.cg-fx .gavel{font-size:30px;display:inline-block;animation:cgGavel .7s ease .9s both}
.cg-fx h3{margin:6px 0 2px;font:700 22px var(--f-display)}
@keyframes cgFxIn{from{opacity:0}to{opacity:1}}@keyframes cgFxOut{to{opacity:0}}
@keyframes cgCard{from{opacity:0;transform:translateY(60px) scale(.6) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes cgGavel{0%{transform:rotate(-50deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-12deg)}100%{transform:rotate(0)}}
html.calm .cg-seat.on,html.calm .cg-fx .card,html.calm .cg-bar i{animation:none}
/* Head and administration chat */
.ach{display:flex;flex-direction:column;gap:8px;max-height:min(58vh,520px);overflow-y:auto;padding:4px 2px 10px}
.ach .m{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.ach .m.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.ach .m .who{display:block;font-size:11.5px;opacity:.75;margin-bottom:2px}
.ach .m .del{background:none;border:0;color:inherit;opacity:.6;cursor:pointer;font-size:11.5px;padding:0 0 0 8px}
.achform{display:flex;gap:8px;align-items:flex-end;margin-top:10px}.achform textarea{flex:1;min-height:44px;max-height:140px;resize:vertical}
:root[data-realm="council"]{
  --bg:#F4F0F0; --surface:#FFFFFF; --sunk:#EEE6E7; --ink:#1B1315; --muted:#6E5D61; --line:#E2D6D8;
  --accent:#6E1A22; --accent-ink:#FFFFFF; --accent-soft:#F4E0E2; --knock:#FFFFFF;
  --navy:#5B141B; --slate:#1D1517; --silver:#CFC7C8; --band-ink:#F8EFF0;
  --maroon:#6E1A22; --maroon-deep:#3A0B10; --star:#8E2A33;
}
@media (prefers-color-scheme: dark){:root[data-realm="council"]:not([data-theme="light"]){
  --bg:#0F0A0B; --surface:#1A1214; --sunk:#140D0F; --ink:#F2EAEB; --muted:#AB9A9D; --line:#35262A;
  --accent:#E6A1A9; --accent-ink:#1B0B0E; --accent-soft:#3B1A20; --knock:#1A1214;

  --maroon:#A23A45; --maroon-deep:#2A070B; --star:#C25661;
}}
:root[data-realm="council"][data-theme="dark"]{
  --bg:#0F0A0B; --surface:#1A1214; --sunk:#140D0F; --ink:#F2EAEB; --muted:#AB9A9D; --line:#35262A;
  --accent:#E6A1A9; --accent-ink:#1B0B0E; --accent-soft:#3B1A20; --knock:#1A1214;
  --navy:#4A0E15; --slate:#0B0708; --silver:#A79D9F; --band-ink:#F2EAEB;

body,.panel,.tabbar,header.band{transition:background-color .6s ease,color .4s ease,border-color .6s ease}
.council-logo{display:none;height:84px;width:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
[data-realm="council"] .band .crest{display:none}
[data-realm="council"] .council-logo{display:block;animation:clogoIn .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes clogoIn{from{opacity:0;transform:translateY(-10px) scale(.8) rotate(-3deg);filter:blur(4px)}}
[data-realm="council"] header.band{background:radial-gradient(120% 140% at 0% 0%,#7A1D26 0%,var(--navy) 42%,#1A0A0D 100%)}
[data-realm="council"] header.band .ghost{opacity:0}
[data-realm="council"] .rim{background:linear-gradient(#EDE8E8 0 4px,#121012 4px)}
header.band .cstars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
[data-realm="council"] header.band .cstars{opacity:1}
.cstars i{position:absolute;width:var(--s);height:var(--s);background:rgba(255,235,238,.16);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:twinkle var(--t) ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.7) rotate(-8deg);opacity:.4}to{transform:scale(1.1) rotate(10deg);opacity:1}}
[data-realm="council"] .brand h1{letter-spacing:.06em}
[data-realm="council"] .tab-ink{background:var(--maroon)}
[data-realm="council"] .btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip.realm{background:rgba(255,255,255,.14);color:var(--band-ink);cursor:pointer;border:1px solid rgba(255,255,255,.22);transition:transform .25s var(--spring),background .2s}
.chip.realm:hover{transform:translateY(-1px) scale(1.04);background:rgba(255,255,255,.24)}
.chip.realm .st{color:#E8A0A8;font-size:13px}

/* transformation */
.realm-fx{position:fixed;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.realm-fx .rf-bg{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),#8A2530 0%,#4B0F16 34%,#14080A 75%);clip-path:circle(0 at var(--x) var(--y));animation:rfOpen .72s cubic-bezier(.7,0,.25,1) forwards}
.realm-fx.to-pa .rf-bg{background:radial-gradient(circle at var(--x) var(--y),#3E5684 0%,#233253 40%,#0E1424 80%)}
@keyframes rfOpen{to{clip-path:circle(150vmax at var(--x) var(--y))}}
.realm-fx .rf-logo{position:absolute;left:50%;top:46%;width:min(440px,78vw);height:auto;transform:translate(-50%,-50%) scale(.55);opacity:0;filter:blur(8px) drop-shadow(0 0 28px rgba(255,200,205,.35));animation:rfLogo .8s .32s cubic-bezier(.2,1.3,.35,1) forwards}
.realm-fx.to-pa .rf-logo{width:min(200px,46vw);filter:blur(8px) drop-shadow(0 0 24px rgba(200,215,240,.45))}
@keyframes rfLogo{to{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) drop-shadow(0 0 28px rgba(255,200,205,.35))}}
.realm-fx .rf-cap{position:absolute;left:0;right:0;top:calc(46% + min(130px,24vw));text-align:center;font-family:var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:#F4E6E8;font-size:clamp(13px,2.4vw,18px);opacity:0;animation:rfCap .6s .62s ease forwards}
.realm-fx.to-pa .rf-cap{top:calc(46% + min(150px,30vw))}
@keyframes rfCap{from{opacity:0;letter-spacing:.6em}to{opacity:1;letter-spacing:.32em}}
.realm-fx .rf-star{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);background:#F1D5D9;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:0;animation:rfStar 1.25s var(--d) cubic-bezier(.15,.8,.25,1) forwards}
.realm-fx.to-pa .rf-star{background:#D9E1EE;clip-path:polygon(38% 0,62% 0,62% 38%,100% 38%,100% 62%,62% 62%,62% 100%,38% 100%,38% 62%,0 62%,0 38%,38% 38%)}
@keyframes rfStar{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--r))}}
.realm-fx.out .rf-bg{animation:rfClose .62s cubic-bezier(.6,0,.3,1) forwards}
@keyframes rfClose{from{clip-path:circle(150vmax at 50% 0)}to{clip-path:circle(0 at 50% -10%)}}
.realm-fx.out .rf-logo{animation:rfLogoOut .5s ease-in forwards}
@keyframes rfLogoOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-120%) scale(.5)}}
.realm-fx.out .rf-cap{animation:rfLogoFade .3s ease-in forwards}
@keyframes rfLogoFade{to{opacity:0}}

/* hub */
.c-hero{position:relative;overflow:hidden;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--surface) 55%,color-mix(in srgb,var(--maroon) 9%,var(--surface)))}
.c-hero .plate{background:#FBF7F6;border-radius:14px;padding:10px 14px;box-shadow:0 10px 26px -14px rgba(60,10,15,.6);transform:rotate(-1.5deg);animation:plateIn .8s var(--spring) both}
.c-hero .plate img{display:block;height:92px;width:auto}
@keyframes plateIn{from{opacity:0;transform:rotate(-8deg) scale(.8)}}
.c-hero h2{font-size:clamp(22px,3vw,28px)}
.c-hero .bigstar{position:absolute;right:-24px;bottom:-34px;width:150px;height:150px;background:color-mix(in srgb,var(--maroon) 12%,transparent);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spinSlow 40s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.c-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:12px;margin:14px 0}
.c-stat{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform .25s var(--spring),border-color .2s;text-align:left;appearance:none;font:inherit;color:inherit}
.c-stat:hover{transform:translateY(-3px);border-color:var(--maroon)}
.c-stat b{display:block;font-family:var(--f-display);font-size:28px;color:var(--maroon);line-height:1.1}
.c-stat span{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.c-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px}
.c-av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--maroon),#1D1012);box-shadow:0 0 0 2px var(--surface),0 0 0 3px color-mix(in srgb,var(--maroon) 40%,transparent)}
.c-av.head{background:linear-gradient(135deg,#233253,#667589)}
.c-member{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);animation:rise .45s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms)}
.c-member .who{flex:1;min-width:0}.c-member .who b{display:block}
.c-member .who small{color:var(--muted);font-size:12.5px}
.tag.muted-tag{background:var(--danger-soft);color:var(--danger)}
.tag.maroon{background:var(--accent-soft);color:var(--maroon)}
.c-mutebar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--ink);font-size:14px;animation:rise .4s var(--spring)}

/* chat */
.c-chat{display:flex;flex-direction:column;height:calc(100dvh - 250px);min-height:380px;padding:0;overflow:hidden}
.c-msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;scroll-behavior:smooth}
.c-day{align-self:center;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:3px 10px;border-radius:999px;margin:10px 0 6px}
.c-msg{display:flex;gap:8px;align-items:flex-end;max-width:min(560px,86%);animation:msgIn .35s var(--spring) both}
.c-msg.mine{align-self:flex-end;flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
.c-msg .c-av{width:30px;height:30px;font-size:11px}
.c-msg.cont .c-av{visibility:hidden}
.c-bub{position:relative;background:var(--sunk);padding:8px 12px;border-radius:16px 16px 16px 4px;min-width:0;word-wrap:break-word;overflow-wrap:anywhere}
.c-msg.mine .c-bub{background:var(--maroon);color:#fff;border-radius:16px 16px 4px 16px}
.c-bub .nm{font-size:12px;font-weight:700;color:var(--maroon);display:block;margin-bottom:2px}
.c-bub .nm small{font-weight:400;color:var(--muted)}
.c-bub .tx{white-space:pre-wrap;font-size:14.5px;line-height:1.45}
.c-bub .tm{font-size:10.5px;opacity:.6;margin-left:8px;float:right;margin-top:6px}
.c-bub img.cimg{display:block;width:280px;height:auto;max-width:100%;max-height:320px;border-radius:10px;margin:4px 0;cursor:zoom-in;background:color-mix(in srgb,var(--ink) 8%,transparent);min-height:60px;min-width:80px;object-fit:cover}
.c-bub .acts{position:absolute;top:-12px;right:6px;display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 4px;box-shadow:var(--shadow)}
.c-msg.mine .c-bub .acts{right:auto;left:6px}
.c-bub:hover .acts,.c-bub:focus-within .acts{display:flex}
.c-bub .acts button{appearance:none;border:0;background:none;cursor:pointer;font-size:12px;padding:2px 6px;color:var(--muted);border-radius:999px}
.c-bub .acts button:hover{color:var(--danger)}
.c-compose{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.c-compose textarea{flex:1;resize:none;max-height:140px;min-height:42px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.c-compose .iconbtn{font-size:20px;padding:8px}
.c-compose .send{border-radius:12px;padding:10px 14px}
.c-preview{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.c-preview img{height:54px;border-radius:8px}
.lightbox{width:auto;max-width:min(96vw,1100px);padding:10px;background:#0E0809}
.lightbox img{display:block;max-width:100%;max-height:82vh;border-radius:10px;margin:auto}

/* desks */
.c-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.c-col{background:var(--sunk);border-radius:14px;padding:10px;min-height:120px;scroll-snap-align:start}
.c-col h3{font-family:var(--f-body);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
.c-card{display:block;width:100%;text-align:left;appearance:none;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--maroon);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s;animation:rise .4s var(--spring) both;animation-delay:calc(var(--i,0) * 35ms)}
.c-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.c-card b{display:block;font-size:14px}
.c-card .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:4px 10px;flex-wrap:wrap}
.c-card.late{border-left-color:var(--danger)}
.c-card.done{opacity:.72}
.c-ledger .row{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;animation:rise .35s var(--spring) both;animation-delay:calc(var(--i,0) * 30ms)}
.c-ledger .row:hover{background:var(--sunk)}
.c-ledger .amt{font-family:var(--f-mono);font-weight:600}
.c-ledger .in{color:var(--ok)}.c-ledger .out{color:var(--danger)}
.c-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:6px}
.c-checks label{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);font-size:14px;padding:6px 8px;border-radius:8px;background:var(--sunk);cursor:pointer}
.c-imgfield img{max-height:120px;border-radius:8px;display:block;margin-top:6px}
.c-progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.c-progress i{display:block;height:100%;width:var(--w);background:var(--maroon);border-radius:99px;transition:width .6s var(--spring)}
.c-desknote{font-size:13px;color:var(--muted);margin:-6px 0 12px}

/* ---------- design pass v5 ---------- */
:root{--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--tap:44px}
/* Text selects and copies everywhere (chats, bills, names, handbooks); controls and swipe handles don't. */
body{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;-webkit-text-size-adjust:100%}
button,.btn,label.btn,.tab,.bn,.bn-tile,.seg,.chip.out,.chip.realm,.iconbtn,.linkbtn,.qa,.cg-seat,.rs-head,.quick,.swatches,.grab,.realm-fx,.cg-fx{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,a,label,.tab,.bn,[role=button]{-webkit-tap-highlight-color:transparent}
.c-bub,.c-bub *,.msg,.ach .m,.cp-body,.cp-reply,.report-body,.handbook,pre.ann,.cg-bill,.drawer h2,.keybox,.tcard,.entries .e{-webkit-user-select:text;user-select:text}
.keybox{-webkit-user-select:all;user-select:all}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}

/* one icon set */
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.ic.dots{stroke-width:3.2}
.qa .ic{color:var(--slate);transition:transform .35s var(--spring)}
.qa:hover .ic{transform:scale(1.2) rotate(-8deg)}

/* hours ring with milestones */
.ringwrap .ms{fill:var(--knock);stroke:currentColor;stroke-width:1.6;opacity:.75;transition:fill .4s,opacity .4s}
.kpi.hero .ringwrap .ms{fill:var(--navy)}
.ringwrap .ms.on{fill:currentColor;opacity:1}
.ringwrap.big{width:136px;height:136px}
.ringwrap.big .pct{font-size:30px}
.me-hero{align-items:center;gap:20px}
.me-hero>div:last-child{min-width:0;flex:1}
.msteps{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.mst{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;font-size:12.5px;background:color-mix(in srgb,currentColor 10%,transparent);opacity:.7}
.mst i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;box-shadow:inset 0 0 0 1.5px currentColor}
.mst.on{opacity:1;background:color-mix(in srgb,currentColor 18%,transparent)}
.mst.on i{background:var(--ok);box-shadow:none;color:#fff}
.drawer .mst{color:var(--ink)}
.enter .mst{animation:pop .45s var(--spring) both;animation-delay:calc(450ms + var(--k) * 90ms)}
.me-hero.won{box-shadow:inset 0 0 0 3px var(--silver),0 0 0 6px color-mix(in srgb,var(--ok) 35%,transparent),var(--shadow);transition:box-shadow .6s}
.ringwrap.pulse{animation:pulse .9s var(--spring)}

/* empty and loading states */
.empty:not(.post-cover){display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 16px;font-size:14.5px;line-height:1.5;max-width:46ch;margin-inline:auto;text-wrap:balance}
.empty:not(.post-cover)::before{content:"";width:52px;height:52px;border-radius:50%;flex:none;background:var(--accent-soft) center/24px no-repeat;

/* Congress: class blocs */
.cg-hemi{container-type:inline-size}

/* @mentions */

.mention.me{color:var(--accent-ink);background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}

.mention-pop{position:fixed;z-index:95;max-height:280px;overflow:auto;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-line);box-shadow:0 24px 50px -20px rgba(0,0,0,.6);animation:mpIn .22s var(--spring) both;transform-origin:bottom left}

.mention-pop .mp{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:none;color:var(--ink);text-align:start;cursor:pointer;font:inherit}
.mention-pop .mp.on,.mention-pop .mp:hover{background:var(--accent-soft)}
.mention-pop .mp b{display:block;font-size:14px}.mention-pop .mp small{display:block;font-size:12px;color:var(--muted)}
.mention-pop .av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-body)}
@keyframes mpIn{from{opacity:0;transform:translateY(8px) scale(.96)}}
/* light catching the glass under the pointer */
.panel,.c-stat,.qa,.tcard,.post{--mx:50%;--my:50%}
.panel.lit,.c-stat.lit,.qa.lit,.tcard.lit,.post.lit{background-image:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.07),transparent 60%)!important}

/* theme switch: the new look spreads out from the button */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:themeReveal .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes themeReveal{from{clip-path:circle(0 at var(--tx,90%) var(--ty,5%))}to{clip-path:circle(150vmax at var(--tx,90%) var(--ty,5%))}}

/* blacklisted: hazard tape and a red pulse on their roster card */
.vrow.bl,.tcard.bl{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--danger) 55%,transparent)!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 30%,transparent),0 0 22px -6px color-mix(in srgb,var(--danger) 60%,transparent);animation:blPulse 2.6s ease-in-out infinite}

<script>
(() => {
"use strict";
const DEFAULTS = { teamName: "Primum Auxilium", goal: 40, yearStart: "2026-09-01", sem2: "2027-01-01", yearEnd: "2027-06-30", customStatuses: [], verifiedOnly: false, promo: { electedHours: 15, electedEvents: 2, supHours: 40, supEvents: 5 } };
const RANKS = [
  { id: "probationary", label: "Probationary Volunteer" },
  { id: "elected", label: "Elected Volunteer" },
  { id: "supervisory", label: "Supervisory Volunteer" },
  { id: "logistics", label: "Logistics", unique: true }
];
const TONES = ["teal", "violet", "rose", "blue", "brass", "grey"];
const REPORT_KINDS = ["Event report", "Weekly summary", "Incident", "Audit"];
const S = { volunteers: {}, entries: {}, reports: {}, events: {}, accounts: {}, complaints: {}, queries: {}, logs: {}, reviews: {}, appeals: {}, cchat: {}, cmutes: {}, cwork: {}, achat: {}, seats: {}, bills: {}, cvotes: {}, cgchat: {}, bans: {}, cachat: {}, clubs: {}, csess: {}, cinc: {}, settings: { ...DEFAULTS } };
const COLLS = ["volunteers", "entries", "reports", "events", "accounts", "complaints", "queries", "logs", "reviews", "appeals", "cchat", "cmutes", "cwork", "achat", "seats", "bills", "cvotes", "cgchat", "bans", "cachat", "clubs", "csess", "cinc", "audit"];
let db = null, downloads = null, mode = "loading";
const DESKTOP = !!window.PA_DESKTOP;
let view = "dashboard";
const ui = { shut: new Set(), imp: null, thread: null, q: "", grade: "all", status: "all", rank: "all", verifying: null, drawer: null, modal: null, logPrefill: null, confirm: null };

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parse = iso => new Date(iso + "T00:00:00");
const fmtDate = (iso, opts = { month: "short", day: "numeric" }) => iso ? parse(iso).toLocaleDateString(undefined, opts) : "";
const fmtLong = iso => fmtDate(iso, { month: "long", day: "numeric", year: "numeric" });
const r1 = n => Math.round(n * 10) / 10;
const fmtH = n => `${r1(n)}`;
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const initials = n => String(n || "?").trim().split(/\s+/).map(p => p[0]).slice(0, 2).join("").toUpperCase();
// Full motion by default; anyone can switch to calm motion from the header (remembered on this device).
const reduced = () => document.documentElement.classList.contains("calm");
try { document.documentElement.dataset.theme = localStorage.getItem("pa-theme") === "light" ? "light" : "dark"; } catch { document.documentElement.dataset.theme = "dark"; }
try { const m = localStorage.getItem("pa-motion"); if (m === "calm") document.documentElement.classList.add("calm"); document.documentElement.classList.toggle("calm-pick", m === "calm"); } catch {}
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- statuses ---------- */
function statuses() {
  const g = S.settings.goal;
  return [
    { id: "active", label: "Not completed", tone: "warn", rule: "owes" },
    { id: "completed", label: `Completed ${g} h`, tone: "ok", rule: "done" },
    { id: "prior", label: "Completed last year", tone: "blue", rule: "exempt" },
    { id: "unwilling", label: "Unwilling", tone: "grey", rule: "warn" },
    { id: "blacklisted", label: "Blacklisted", tone: "danger", rule: "block" },
    ...(S.settings.customStatuses || []).map(c => ({ ...c, rule: "owes", custom: true }))
  ];
}
const statusOf = id => statuses().find(s => s.id === id) || { id, label: id || "Unknown", tone: "grey", rule: "owes" };
const pill = id => { const s = statusOf(id); return `<span class="pill t-${s.tone}">${esc(s.label)}</span>`; };

/* ---------- derived data ---------- */
const vols = () => Object.entries(S.volunteers).map(([id, v]) => ({ id, ...v }));
const entries = () => Object.entries(S.entries).map(([id, e]) => ({ id, ...e }));
function inYear(e) { const s = S.settings; return e.date >= s.yearStart && e.date <= s.yearEnd; }
const counts = e => inYear(e) && (!S.settings.verifiedOnly || !!e.verifiedBy);
function hoursFor(vid) { let t = 0; for (const e of Object.values(S.entries)) if (e.volunteerId === vid && counts(e)) t += Number(e.hours) || 0; return t; }
// Every volunteer's total in one pass over the entries, for views that list everyone.
function hoursMap() { const m = new Map(); for (const e of Object.values(S.entries)) if (counts(e)) m.set(e.volunteerId, (m.get(e.volunteerId) || 0) + (Number(e.hours) || 0)); return id => m.get(id) || 0; }
// Date the running total first reached the goal: the certificate's award date.
function earnedOn(vid) {
  let t = 0; const g = S.settings.goal;
  for (const e of entries().filter(e => e.volunteerId === vid && counts(e)).sort((a, b) => a.date.localeCompare(b.date))) { t += Number(e.hours) || 0; if (t >= g) return e.date; }
  return null;
}
const rankOf = v => RANKS.find(x => x.id === v.rank);
// Council members by roster id. Accounts when this person can see them (Head, council); otherwise the council list,
// so administration and volunteers see the council too. Cached briefly: the roster calls it for every row.
let cmCache = null, cmKey = "", cmAt = 0;
const councilMap = () => {
  const key = Object.keys(S.volunteers).length + "|" + Object.keys(S.accounts).length;
  if (cmCache && key === cmKey && Date.now() - cmAt < 3000) return cmCache;
  const m = {}, accs = Object.entries(S.accounts).filter(([, a]) => a.role === "council");
  if (accs.length) for (const [id, a] of accs) { const vid = councilVol(a); if (vid) m[vid] = { id, title: a.title || "Student Council", perm: a.perm || "" }; }
  else for (const [name, title, perm] of COUNCIL) { const vid = councilVol({ name }); if (vid) m[vid] = { id: null, title, perm }; }
  cmCache = m; cmKey = key; cmAt = Date.now(); return m;
};
// Council members carry their council position as their rank.
const rankLabel = v => { const cm = councilMap()[v.id]; return cm ? cm.title : rankOf(v)?.label || ""; };
const rankBadge = v => { const cm = councilMap()[v.id]; if (cm) return `<span class="rank r-council c-${esc(cm.perm || "member")}">${CARD_EMB[cm.perm] ? `<svg class="rk-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${CARD_EMB[cm.perm]}"/></svg>` : "★ "}${esc(cm.title)}</span>`; const k = rankOf(v); return k ? `<span class="rank r-${k.id}">${k.label}</span>` : ""; };
const headVol = () => vols().find(v => v.head);
function supervisorNames() {
  const n = new Set(vols().filter(v => v.head || ["supervisory", "logistics"].includes(v.rank)).map(v => v.name));
  entries().forEach(e => e.verifiedBy && n.add(e.verifiedBy));
  Object.values(S.events).forEach(e => e.supervisor && n.add(e.supervisor));
  return [...n].slice(0, 40);
}
const supList = () => `<datalist id="supList">${supervisorNames().map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>`;
// Crossing the goal flips "owes" statuses to completed; the certificate itself is derived from hours.
async function afterHours(vid, before) {
  const v = S.volunteers[vid], g = S.settings.goal;
  if (!v || before >= g || hoursFor(vid) < g) return false;
  if (statusOf(v.status).rule === "owes") await put("volunteers", vid, { ...v, status: "completed" });
  return true;
}
function isDone(v, h = hoursFor(v.id)) { const r = statusOf(v.status).rule; return r === "done" || r === "exempt" || h >= S.settings.goal; }
function g11Locked(date = todayISO()) { return date < S.settings.sem2; }
const SECTIONS = ["C", "B", "A"];
const cls = v => `${v.grade}${v.section || ""}`;

let seenIds = null;
function rosterRows() {
  const q = ui.q.trim().toLowerCase(), goal = S.settings.goal, locked = g11Locked(), hf = hoursMap();
  const list = sortVols(vols().filter(v => (!q || v.name.toLowerCase().includes(q)) && (ui.grade === "all" || String(v.grade) === String(ui.grade)) && (ui.status === "all" || (v.status || "active") === ui.status) && (ui.rank === "all" || v.rank === ui.rank) && (!ui.gov || ui.gov === "all" || (ui.gov === "ready") === govReady(v))));

  let i = 0;
  const row = v => {
    const k = Math.min(i++, 14), h = hf(v.id), d = isDone(v, h), rule = statusOf(v.status).rule, fresh = seenIds && !seenIds.has(v.id);
    return `<button class="vrow ${v.head ? "head" : v.grade === 12 ? "p12" : ""}${fresh ? " flash" : ""}${rule === "block" ? " bl" : ""}" data-act="open" data-id="${v.id}" style="--i:${k};--tone:var(--${statusOf(v.status).tone || "grey"})">
      <span class="avatar ${v.head ? "hd" : v.grade === 12 ? "g12" : ""}">${esc(initials(v.name))}</span>
      <span class="nmcell" style="min-width:0"><div class="nm">${esc(v.name)}${v.role ? `<span class="role">${esc(v.role)}</span>` : ""}${v.example ? `<span class="ex-tag">Example</span>` : ""}</div><div class="nt">${rankBadge(v)}${govChips(v)}${esc(v.notes || "")}</div></span>
      <span class="gcell"><span class="grade ${v.grade === 12 ? "g12" : ""}">${cls(v)}</span></span>
      <span class="stcell">${pill(v.status || "active")}</span>
      <span class="prog">${rule === "exempt" ? `<span class="lbl"><span>Exempt</span></span>` : `<span class="lbl"><span class="num">${fmtH(h)} / ${goal} h</span><span>${d ? "Done" : fmtH(Math.max(0, goal - h)) + " h left"}</span></span><span class="bar ${d ? "done" : v.grade === 12 ? "g12" : ""}"><i style="--w:${Math.min(100, h / goal * 100)}%;--i:${k}"></i></span>`}</span>
    </button>`;
  };
  const doneN = gv => gv.filter(v => isDone(v, hf(v.id))).length;
  const chev = `<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const secBlock = (key, label, gv, g12) => {
    const dn = doneN(gv), shut = ui.shut.has(key);
    return `<div class="rsec ${shut ? "shut" : ""}"><button class="rs-head" data-act="toggle-sec" data-sec="${key}" aria-expanded="${!shut}"><span class="grade ${g12 ? "g12" : ""}">${label}</span><span class="cnt">${gv.length} · ${dn} done</span><span class="bar mini ${g12 ? "g12" : ""}"><i style="--w:${gv.length ? dn / gv.length * 100 : 0}%"></i></span>${chev}</button><div class="rs-rows"><div>${gv.map(row).join("")}</div></div></div>`;
  };
  let out = "";
  const cmap = councilMap(), head = list.filter(v => v.head);
  if (head.length) out += `<section class="rgrp"><div class="rg-head"><h3>Leadership</h3></div><div class="rs-flat">${head.map(row).join("")}</div></section>`;
  const cv = list.filter(v => !v.head && cmap[v.id]).sort((a, b) => ((C_ORDER.indexOf(cmap[a.id].perm) + 1 || 98) - (C_ORDER.indexOf(cmap[b.id].perm) + 1 || 98)) || a.name.localeCompare(b.name));
  if (cv.length) out += `<section class="rgrp"><div class="rg-head"><h3>Student Council</h3><span class="cnt">${cv.length} member${cv.length === 1 ? "" : "s"} · above shift leads</span></div><div class="rs-flat">${cv.map(row).join("")}</div></section>`;
  for (const g of [12, 11]) {
    const gv = list.filter(v => !v.head && !cmap[v.id] && v.grade === g); if (!gv.length) continue;
    const secs = [...SECTIONS, ""].map(x => [x, gv.filter(v => (SECTIONS.includes(v.section) ? v.section : "") === x)]).filter(([, x]) => x.length);
    out += `<section class="rgrp"><div class="rg-head"><h3>Grade ${g}</h3>${g === 12 ? `<span class="prio">Priority</span>` : locked ? `<span class="lock">Opens ${fmtDate(S.settings.sem2)}</span>` : ""}<span class="cnt">${gv.length} volunteer${gv.length === 1 ? "" : "s"} · ${doneN(gv)} done</span></div>${secs.map(([x, sv]) => secBlock(g + x, x ? `${g}${x}` : `${g} · no class`, sv, g === 12)).join("")}</section>`;
  }
  const other = list.filter(v => !v.head && !cmap[v.id] && ![12, 11].includes(v.grade));
  if (other.length) out += `<section class="rgrp"><div class="rg-head"><h3>Other</h3><span class="cnt">Set grade to 11 or 12</span></div><div class="rs-flat">${other.map(row).join("")}</div></section>`;
  seenIds = new Set(vols().map(v => v.id));
  return out;
}

  return `<div class="logwrap st">

function volOptions(sel) {
  const all = sortVols(vols()), groups = [["head", "Head Of Volunteers"], [12, "Grade 12 · Priority"], [11, "Grade 11"], ["other", "Other"]];
  if (!all.length) return `<option value="">Add a volunteer on the Roster first</option>`;
  return `<option value="">Choose a volunteer</option>` + groups.map(([g, l]) => {
    const gv = all.filter(v => g === "head" ? v.head : g === "other" ? !v.head && ![12, 11].includes(v.grade) : !v.head && v.grade === g); if (!gv.length) return "";
    return `<optgroup label="${l}">${gv.map(v => `<option value="${v.id}" ${sel === v.id ? "selected" : ""}>${cls(v)} · ${esc(v.name)}${statusOf(v.status).rule === "block" ? " (blacklisted)" : ""}</option>`).join("")}</optgroup>`;
  }).join("");
}
function refreshLogSelect() { const s = $("#logVol"); if (!s) return; const v = s.value; s.innerHTML = volOptions(v); }
function logCheck() {
  const vid = $("#logVol")?.value, date = $("#logDate")?.value, hours = Number($("#logHours")?.value);
  const v = S.volunteers[vid]; const out = { ok: false, msgs: [] };
  if (!v) return out;
  const st = statusOf(v.status);
  if (st.rule === "block") out.msgs.push(["block", `<b>${esc(v.name)} is blacklisted.</b> Change their status on the Roster before logging hours.`]);
  else if (v.grade === 11 && date && g11Locked(date)) out.msgs.push(["block", `<b>Grade 11 can't log hours before semester 2.</b> Hours for ${esc(v.name)} count from ${fmtLong(S.settings.sem2)}.`]);
  if (st.rule === "warn") out.msgs.push(["warn", `<b>Marked unwilling.</b> You can still log this, but check their status afterwards.`]);
  if (st.rule === "exempt") out.msgs.push(["info", `<b>Already completed last year.</b> These hours are recorded but not required.`]);
  if (date && (date < S.settings.yearStart || date > S.settings.yearEnd)) out.msgs.push(["warn", `<b>Outside this school year.</b> It will be saved but won't count toward ${S.settings.goal} h.`]);
  if (date && date > todayISO()) out.msgs.push(["warn", `<b>That date is in the future.</b>`]);
  if (hours > 24) out.msgs.push(["block", `<b>One entry can't be more than 24 hours.</b> Split longer stretches into one entry per day.`]);
  out.ok = !out.msgs.some(m => m[0] === "block") && hours > 0 && hours <= 24 && !!date;
  return out;
}
function updateLogRules() {
  const r = $("#logRules"); if (!r) return;
  const c = logCheck();
  r.innerHTML = c.msgs.map(([k, m]) => `<div class="rule ${k}"><div>${m}</div></div>`).join("");
  $("#logSubmit").disabled = !c.ok;
  const v = S.volunteers[$("#logVol").value], p = $("#volPreview");
  if (!v) { p.innerHTML = ""; return; }
  const h = hoursFor($("#logVol").value), g = S.settings.goal, d = isDone(v, h);
  p.innerHTML = `<div class="volpreview"><span class="avatar ${v.grade === 12 ? "g12" : ""}">${esc(initials(v.name))}</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${pill(v.status || "active")}</span><span class="num">${fmtH(h)} / ${g} h</span></div><div class="bar ${d ? "done" : v.grade === 12 ? "g12" : ""}"><i style="--w:${Math.min(100, h / g * 100)}%"></i></div></div></div>`;
}
after.log = () => {
  const f = $("#logForm");
  ["#logVol", "#logDate", "#logHours"].forEach(s => { $(s).addEventListener("input", updateLogRules); $(s).addEventListener("change", updateLogRules); });
  f.querySelectorAll("[data-hours]").forEach(b => b.addEventListener("click", () => { $("#logHours").value = b.dataset.hours; updateLogRules(); }));
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!logCheck().ok) return;
    const vid = $("#logVol").value, v = S.volunteers[vid];
    const before = hoursFor(vid);
    const by = $("#logVerify").value.trim();
    const entry = { volunteerId: vid, date: $("#logDate").value, hours: r1(Number($("#logHours").value)), activity: $("#logAct").value.trim(), notes: $("#logNotes").value.trim(), created: new Date().toISOString(), ...(by ? { verifiedBy: by, verifiedAt: todayISO() } : {}) };
    $("#logHours").value = ""; $("#logAct").value = ""; $("#logNotes").value = "";
    await put("entries", uid(), entry);
    if (await afterHours(vid, before)) { toast(`${v.name} reached ${S.settings.goal} h · certificate issued`); confetti(); }
    else toast(`Logged ${entry.hours} h for ${v.name}${S.settings.verifiedOnly && !by ? ". It counts once it's signed off." : ""}`);
    updateLogRules();
  });
  updateLogRules();
  ui.logPrefill = null;
};

function reportCards() {

function auditText() {
  const s = S.settings, g = s.goal, all = sortVols(vols()).map(v => ({ ...v, h: hoursFor(v.id) }));
  const tot = all.reduce((t, v) => t + v.h, 0);
  const lines = [`${s.teamName} volunteer audit, ${fmtLong(todayISO())}`, `School year ${fmtLong(s.yearStart)} to ${fmtLong(s.yearEnd)}. Requirement: ${g} hours.`, `Team total: ${fmtH(tot)} hours across ${all.length} volunteers, ${fmtH(entries().filter(e => inYear(e) && e.verifiedBy).reduce((t, e) => t + (Number(e.hours) || 0), 0))} of them signed off by a supervisor.`, `Certificates earned: ${all.filter(v => earnedOn(v.id)).length}.`, ""];
  for (const st of statuses()) {
    const grp = all.filter(v => (v.status || "active") === st.id); if (!grp.length) continue;
    lines.push(`${st.label} (${grp.length})`);
    grp.forEach(v => lines.push(`  • ${v.name}${v.role ? ` (${v.role})` : ""}, ${cls(v)}: ${fmtH(v.h)} h${st.rule === "owes" ? `, ${fmtH(Math.max(0, g - v.h))} h to go` : ""}`));
    lines.push("");
  }
  return lines.join("\n").trim();
}

function closeOverlay() {

// Page change: the old view slides away, the new one slides in from the side you're heading to.
let swapGen = 0;
function swap(fn, dir = "fwd") {
  const v = $("#view");
  if (reduced() || !v) return fn();
  const g = ++swapGen;
  v.classList.remove("tab-in-fwd", "tab-in-back"); v.classList.add("tab-out-" + dir);
  setTimeout(() => {
    if (g !== swapGen) return;
    v.classList.remove("tab-out-fwd", "tab-out-back"); fn();
    void v.offsetWidth; v.classList.add("tab-in-" + dir);
    setTimeout(() => { if (g === swapGen) v.classList.remove("tab-in-fwd", "tab-in-back"); }, 600);
  }, 160);
}

/* ---------- class list import ---------- */
const CLASSES = ["12C", "12B", "12A", "11C", "11B", "11A"];
let xlsxLoad = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLoad = xlsxLoad || new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = () => res(window.XLSX); sc.onerror = () => { xlsxLoad = null; rej(new Error("xlsx")); }; document.head.appendChild(sc); });
}
function classFrom(t) { const m = String(t || "").match(/(?:^|[^0-9])(1[12])\s*[-_ ]?\s*([abc])(?![a-z])/i); return m ? m[1] + m[2].toUpperCase() : ""; }
const normName = t => String(t || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z\u0600-\u06ff]+/g, " ").trim();
const LABEL_RE = /competitor|reci?e?ptionist|receptionist|\bproject\b|participants?\b|\bteam\b|\bgroup\b|\btotal\b|\blist\b|substitute|reserve|\bsheet\b/i;
const HEAD_RE = /^(names?|full ?name|student( name)?s?|nom|pr[ée]nom|first ?name|last ?name|surname|class|grade|section|no\.?|#|id)$/i;
const looksName = t => { t = String(t ?? "").trim(); return t.length >= 2 && t.length <= 60 && /\p{L}/u.test(t) && !/[\d@]/.test(t); };
function tidyName(t) {
  let n = String(t ?? "").replace(/\s+/g, " ").trim();
  if (n === n.toUpperCase() && /[A-Z]/.test(n)) n = n.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  return n;
}
function extractNames(rows) {
  rows = rows.filter(r => Array.isArray(r) && r.some(c => String(c ?? "").trim()));
  let hi = -1, cols = null, arCol = -1;
  for (let i = 0; i < Math.min(6, rows.length) && !cols; i++) {
    const h = rows[i].map(c => String(c ?? "").trim().toLowerCase());
    const first = h.findIndex(c => /^(first|given)\s*name|^pr[ée]nom/.test(c));
    const last = h.findIndex(c => /^(last|family)\s*name|^surname|^nom( de famille)?$/.test(c));
    const en = h.findIndex(c => /^english\s*name/.test(c)), ar = h.findIndex(c => /^arabic\s*name/.test(c));
    const full = h.findIndex(c => /name|student|[ée]l[èe]ve|^nom/.test(c) && !/first|last|given|family|sur|pr[ée]nom|school|teacher|parent|guardian|number|arabic|birth|place|nationality|passport|iqama|id\b/.test(c));
    if (en >= 0) { hi = i; cols = [en]; arCol = ar; }
    else if (first >= 0 && last >= 0) { hi = i; cols = [first, last]; }
    else if (full >= 0) { hi = i; cols = [full]; }
  }
  if (!cols) {
    const w = Math.max(0, ...rows.map(r => r.length)); let best = -1, score = 0;
    for (let c = 0; c < w; c++) { const n = rows.filter(r => looksName(r[c]) && !HEAD_RE.test(String(r[c]).trim())).length; if (n > score) { score = n; best = c; } }
    if (best < 0) return []; cols = [best];
  }
  const out = [], seen = new Set();
  for (const r of rows.slice(hi + 1)) {
    const n = tidyName(cols.map(c => String(r[c] ?? "").trim()).filter(Boolean).join(" "));
    if (!looksName(n) || HEAD_RE.test(n) || LABEL_RE.test(n) || seen.has(normName(n))) continue;
    seen.add(normName(n)); out.push(n);
    if (arCol >= 0) { const a = String(r[arCol] ?? "").replace(/\s+/g, " ").trim(); if (a && /[\u0600-\u06FF]/.test(a)) (out.ar = out.ar || {})[normName(n)] = a; }
  }
  return out;
}
const rosterHas = n => vols().some(v => normName(v.name) === normName(n) || (v.head && sameWho(v.name, n)));
async function importFiles(files) {
  files = [...files].filter(f => /\.(xlsx|xlsm|xls|csv|ods)$/i.test(f.name));
  if (!files.length) return toast("Excel or CSV files only.");
  let X; try { X = await loadXLSX(); } catch { return toast("Spreadsheet reader unavailable. Check the connection."); }
  const batches = [];
  for (const f of files) {
    let wb; try { wb = X.read(await f.arrayBuffer(), { type: "array" }); } catch { toast(`${f.name}: unreadable`); continue; }
    const fileCls = classFrom(f.name.replace(/\.[^.]+$/, ""));
    for (const sn of wb.SheetNames) {
      const names = extractNames(X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, blankrows: false, defval: "" }));
      if (!names.length) continue;
      batches.push({ src: wb.SheetNames.length > 1 ? `${f.name} › ${sn}` : f.name, cls: classFrom(sn) || fileCls, names: names.map(n => { const dup = rosterHas(n); return { n, dup, on: !dup && /\s/.test(n), ar: names.ar?.[normName(n)] || "" }; }) });
    }

}
